components:
  schemas:
    BackupSchedule:
      type: object
      required: [id, enabled, intervalSeconds, onUsbAttach, updatedAt]
      properties:
        id: {type: string}
        enabled: {type: boolean}
        intervalSeconds: {type: integer, format: int64}
        onUsbAttach: {type: boolean}
        lastStartedAt: {type: string, format: date-time}
        nextDueAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    ShareAccessPreview:
      type: object
      required: [shareId, name, enabled, guestAccess, entries, accessRules]
      properties:
        shareId: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        guestAccess: {type: boolean}
        entries:
          type: array
          items:
            type: object
            required: [principalId, name, kind, enabled, level]
            properties:
              principalId: {type: string}
              name: {type: string}
              kind: {type: string, enum: [user, group, service]}
              enabled: {type: boolean}
              level: {type: string, enum: [read, write, admin]}
              grantedBy: {type: array, items: {type: string}}
              guest: {type: boolean}
        accessRules:
          type: array
          items:
            type: object
            required: [principalId, level]
            properties:
              principalId: {type: string}
              level: {type: string, enum: [read, write, admin]}

    VirtualMachineConsole:
      type: object
      required: [output, cursor, connected]
      properties:
        output: {type: string}
        cursor: {type: integer, minimum: 0}
        connected: {type: boolean}

    VirtualizationStatus:
      type: object
      required: [libvirtAvailable, kvmAvailable, architecture, cpuCount, memoryBytes]
      properties:
        libvirtAvailable: {type: boolean}
        kvmAvailable: {type: boolean}
        architecture: {type: string}
        cpuCount: {type: integer}
        memoryBytes: {type: integer, format: int64}
        reason: {type: string}

    VirtualizationMedia:
      type: object
      required: [name, sizeBytes]
      properties:
        name: {type: string}
        sizeBytes: {type: integer, format: int64}

    CreateVirtualMachine:
      type: object
      required: [name, iso, vcpus, memoryMiB, diskGiB]
      properties:
        name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'}
        iso: {type: string}
        vcpus: {type: integer, minimum: 1, maximum: 64}
        memoryMiB: {type: integer, minimum: 512, maximum: 1048576}
        diskGiB: {type: integer, minimum: 8, maximum: 16384}

    VirtualMachine:
      type: object
      required: [name, state]
      properties:
        name: {type: string}
        uuid: {type: string}
        state: {type: string}
        vcpus: {type: integer}
        memoryKiB: {type: integer, format: int64}
        maximumMemoryKiB: {type: integer, format: int64}
        diskPath: {type: string}
        iso: {type: string}

    VirtualMachineDeleteResult:
      type: object
      required: [name, diskPath, diskRemoved, definitionRetained]
      properties:
        name: {type: string}
        diskPath: {type: string}
        diskRemoved: {type: boolean}
        definitionRetained: {type: boolean}

    RecoverableVirtualMachine:
      type: object
      required: [name, diskPath, diskBytes]
      properties:
        name: {type: string}
        diskPath: {type: string}
        diskBytes: {type: integer, format: int64}

    VirtualMachineSnapshot:
      type: object
      required: [name]
      properties:
        name: {type: string}
        state: {type: string}
        creationTime: {type: string}

    AuthSession:
      type: object
      required: [username, expiresAt, csrfToken]
      properties:
        username: {type: string}
        expiresAt: {type: string, format: date-time}
        csrfToken: {type: string}

    PasskeySummary:
      type: object
      required: [id, name, createdAt, signCount]
      properties:
        id: {type: string, description: Raw credential ID encoded with base64url}
        name: {type: string}
        createdAt: {type: string, format: date-time}
        signCount: {type: integer, format: int64}

    WebAuthnOptionsEnvelope:
      type: object
      additionalProperties: true
      description: WebAuthn JSON options returned by the relying-party library.

    Event:
      type: object
      required: [schemaVersion, id, type, timestamp, severity, data]
      properties:
        schemaVersion:
          type: integer
          minimum: 1
          description: Version of the event envelope contract.
          example: 1
        id:
          type: string
        type:
          type: string
          description: Event kind, including the correlated ups.shutdown.pending, ups.shutdown.started, and ups.shutdown.failed lifecycle events.
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
          enum: [info, warning, critical]
        correlationId:
          type: string
        actor:
          type: string
          description: Correlation key shared by the originating request and asynchronous work.
        operationId:
          type: string
        planHash:
          type: string
        actor:
          type: string
        generation:
          type: integer
        resource:
          $ref: '#/components/schemas/ResourceRef'
        data:
          type: object
          additionalProperties: true

    ResourceRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string

    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database, privilegedBroker, privilegedWorkers]
          properties:
            database:
              type: boolean
            privilegedBroker:
              type: boolean
            privilegedWorkers:
              type: boolean

    HealthState:
      type: string
      enum: [healthy, attention, warning, critical, offline]

    HealthComponent:
      type: object
      required: [id, label, status]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          $ref: '#/components/schemas/HealthState'
        message:
          type: string
        recommended:
          type: string

    HealthBreakdown:
      type: object
      required: [status, score, components]
      properties:
        status:
          $ref: '#/components/schemas/HealthState'
        score:
          type: integer
        components:
          type: array
          items:
            $ref: '#/components/schemas/HealthComponent'

    UPSConfig:
      type: object
      required: [names]
      properties:
        names:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 128

    ServerInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hostname:
          type: string
        version:
          type: string
        nasUuid:
          type: string
        timezone:
          type: string
        health:
          $ref: '#/components/schemas/HealthState'
        ip:
          type: string

    SystemMetrics:
      type: object
      properties:
        cpuPercent:
          type: number
        load:
          type: array
          items:
            type: number
        ramUsedBytes:
          type: integer
        ramTotalBytes:
          type: integer
        cpuTempC:
          type: number
        uptimeSeconds:
          type: integer
        net:
          type: object
          properties:
            interface:
              type: string
            upMbps:
              type: number
            downMbps:
              type: number
        netInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/NetInterfaceMetrics'
        filesystems:
          type: array
          items:
            $ref: '#/components/schemas/FilesystemUsage'

    SystemMetricSample:
      type: object
      required: [capturedAt, metrics]
      properties:
        capturedAt:
          type: string
          format: date-time
        metrics:
          $ref: '#/components/schemas/SystemMetrics'

    FilesystemUsage:
      type: object
      required: [path, totalBytes, usedBytes, availableBytes, usedPercent, state]
      properties:
        path:
          type: string
        totalBytes:
          type: integer
        usedBytes:
          type: integer
        availableBytes:
          type: integer
        usedPercent:
          type: number
        state:
          type: string
          enum: [healthy, warning, critical, unknown]

    NetInterfaceMetrics:
      type: object
      properties:
        interface:
          type: string
        upMbps:
          type: number
        downMbps:
          type: number
        errorsIn:
          type: integer
        errorsOut:
          type: integer
        droppedIn:
          type: integer
        droppedOut:
          type: integer
        up:
          type: boolean

    SmartSummary:
      type: object
      properties:
        overall:
          $ref: '#/components/schemas/HealthState'
        reallocatedSectors:
          type: integer
        pendingSectors:
          type: integer
        uncorrectableSectors:
          type: integer
        crcErrors:
          type: integer
        powerOnHours:
          type: integer
        wearPercent:
          type: number

    Disk:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        currentPath:
          type: string
        model:
          type: string
        serial:
          type: string
        wwn:
          type: string
        gptDiskGuid:
          type: string
        partitionUuid:
          type: string
        filesystemUuid:
          type: string
        sizeBytes:
          type: integer
        usedBytes:
          type: integer
        role:
          type: string
        rotational:
          type: boolean
        interface:
          type: string
        health:
          $ref: '#/components/schemas/HealthState'
        temperatureC:
          type: number
        filesystem:
          type: string
        mounted:
          type: boolean
        poolId:
          type: string
        standby:
          type: boolean
        lastSeen:
          type: string
          format: date-time
        smart:
          $ref: '#/components/schemas/SmartSummary'

    Pool:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        mountPath:
          type: string
        status:
          $ref: '#/components/schemas/HealthState'
        sizeBytes:
          type: integer
        usedBytes:
          type: integer
        members:
          type: array
          items:
            type: object
            properties:
              diskId:
                type: string
              enabled:
                type: boolean

    Protection:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthState'
        parityDisks:
          type: array
          items:
            type: object
        lastSyncAt:
          type: string
          format: date-time
        lastSyncResult:
          type: string
        changesSinceSyncBytes:
          type: integer
        syncSchedule:
          type: string
        scrubSchedule:
          type: string
        syncRunning:
          type: boolean

    DockerSummary:
      type: object
      required: [available, stacks, appsRunning, updatesAvailable]
      properties:
        available:
          type: boolean
        stacks:
          type: integer
        appsRunning:
          type: integer
        updatesAvailable:
          type: integer

    DockerStack:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        status:
          $ref: '#/components/schemas/HealthState'
        state:
          type: string
        images:
          type: array
          items:
            type: string
        composeYaml:
          type: string
        ports:
          type: array
          items:
            type: object
        risks:
          type: array
          items:
            type: string
        recovery:
          $ref: '#/components/schemas/RecoveryContract'
        recoveryCoverage:
          type: number

    DockerDeployment:
      type: object
      required: [id, stackName, kind, state, composeAfter, createdAt, updatedAt]
      properties:
        id:
          type: string
        stackName:
          type: string
        kind:
          type: string
          enum: [install, update, rollback]
        state:
          type: string
          enum: [pending, committed, rolled_back, failed]
        composeBefore:
          type: string
        composeAfter:
          type: string
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DockerContainer:
      type: object
      required: [id, name, image, state, cpuPercent, ramUsedBytes, restarts, ports]
      properties:
        id:
          type: string
        name:
          type: string
        stackId:
          type: string
        image:
          type: string
        state:
          type: string
        cpuPercent:
          type: number
        ramUsedBytes:
          type: integer
        restarts:
          type: integer
        ports:
          type: array
          items:
            type: object
            required: [host, container]
            properties:
              host:
                type: integer
              container:
                type: integer
              label:
                type: string
        startedAt:
          type: string
          format: date-time

    DockerImage:
      type: object
      required: [id, repo, tag, sizeBytes, createdDaysAgo, updateAvailable, inUse]
      properties:
        id:
          type: string
        repo:
          type: string
        tag:
          type: string
        sizeBytes:
          type: integer
        createdDaysAgo:
          type: integer
        updateAvailable:
          type: boolean
        inUse:
          type: boolean

    DockerImagePackSummary:
      type: object
      required: [name, imageCount, totalSizeBytes]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        imageCount:
          type: integer
        totalSizeBytes:
          type: integer

    DockerImagePackImportResult:
      type: object
      required: [pack, imported]
      properties:
        pack:
          type: string
        imported:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            required: [file, reason]
            properties:
              file:
                type: string
              reason:
                type: string

    RecoveryContract:
      type: object
      properties:
        strategy:
          type: string
          enum: [stop-backup, snapshot, custom, none]
        appdataPaths:
          type: array
          items:
            type: string
        preBackupHook:
          $ref: '#/components/schemas/RecoveryHook'
        postBackupHook:
          $ref: '#/components/schemas/RecoveryHook'
        restoreHook:
          $ref: '#/components/schemas/RecoveryHook'
        dbDump:
          $ref: '#/components/schemas/RecoveryHook'
        dbRestore:
          $ref: '#/components/schemas/RecoveryHook'
        stopServices:
          type: array
          items:
            type: string
        startServices:
          type: array
          items:
            type: string

    RecoveryHook:
      type: object
      properties:
        container:
          type: string
        command:
          type: string
        timeout:
          type: integer

    RecoveryManifest:
      type: object
      properties:
        formatVersion:
          type: integer
        configSchema:
          type: integer
        lumonasVersion:
          type: string
        nasUuid:
          type: string
        generation:
          type: integer
        createdAt:
          type: string
          format: date-time
        diskIds:
          type: array
          items:
            type: string
        checksums:
          type: object
          additionalProperties:
            type: string

    RecoveryAppdataRecord:
      type: object
      required: [stack, containerPath, hostPath, archivePath, archiveBytes]
      properties:
        stack:
          type: string
        containerPath:
          type: string
        hostPath:
          type: string
        archivePath:
          type: string
        archiveBytes:
          type: integer

    RecoveryPlan:
      type: object
      required: [manifest, files, verified, databaseValid, desiredStateValid, composeValid, encryptedSecrets]
      properties:
        manifest:
          $ref: '#/components/schemas/RecoveryManifest'
        files:
          type: array
          items:
            type: string
        verified:
          type: boolean
        databaseValid:
          type: boolean
        desiredStateValid:
          type: boolean
        composeValid:
          type: boolean
        encryptedSecrets:
          type: boolean
        appdata:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryAppdataRecord'
        warnings:
          type: array
          items:
            type: string

    RecoveryExport:
      type: object
      required: [path, manifest, verified, appdataArchives, warnings]
      properties:
        path:
          type: string
        manifest:
          $ref: '#/components/schemas/RecoveryManifest'
        verified:
          type: boolean
        appdataArchives:
          type: integer
        warnings:
          type: array
          items:
            type: string

    Share:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        status:
          $ref: '#/components/schemas/HealthState'
        protocols:
          type: array
          items:
            type: object
            properties:
              protocol: {type: string}
              enabled: {type: boolean}
              auditEnabled: {type: boolean}
              auditOperations:
                type: array
                items: {type: string}

    ShareStorageResource:
      type: object
      required: [id, label, path, kind]
      properties:
        id: {type: string}
        label: {type: string}
        path: {type: string}
