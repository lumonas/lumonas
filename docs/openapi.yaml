      summary: Reissue a CSRF token for the current session
      operationId: authCsrf
      description: >-
        CSRF tokens live in daemon memory and are bound to the session they
        were issued for. After a daemon restart (or when a token was issued
        for a previous session) the client can reissue one here instead of
        re-authenticating.
      responses:
        '200':
          description: Fresh CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
