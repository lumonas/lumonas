components:
  schemas:
    AuthSession:
      type: object
      required: [username, expiresAt, csrfToken]
      properties:
        username: {type: string}
        expiresAt: {type: string, format: date-time}
        csrfToken: {type: string}

    PasskeySummary:
      type: object
      required: [id, name, createdAt, signCount]
      properties:
        id: {type: string, description: Raw credential ID encoded with base64url}
        name: {type: string}
        createdAt: {type: string, format: date-time}
        signCount: {type: integer, format: int64}

    WebAuthnOptionsEnvelope:
      type: object
      additionalProperties: true
      description: WebAuthn JSON options returned by the relying-party library.

    Event:
      type: object
      required: [schemaVersion, id, type, timestamp, severity, data]
      properties:
        schemaVersion:
          type: integer
          minimum: 1
          description: Version of the event envelope contract.
          example: 1
        id:
          type: string
        type:
          type: string
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
          enum: [info, warning, critical]
        correlationId:
          type: string
        actor:
          type: string
          description: Correlation key shared by the originating request and asynchronous work.
        operationId:
          type: string
        planHash:
          type: string
        actor:
          type: string
        generation:
          type: integer
        resource:
          $ref: '#/components/schemas/ResourceRef'
        data:
          type: object
          additionalProperties: true

    ResourceRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string

    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database, privilegedBroker]
          properties:
            database:
              type: boolean
            privilegedBroker:
              type: boolean

    HealthState:
      type: string
      enum: [healthy, attention, warning, critical, offline]

    HealthComponent:
      type: object
      required: [id, label, status]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          $ref: '#/components/schemas/HealthState'
        message:
          type: string
        recommended:
          type: string

    HealthBreakdown:
      type: object
      required: [status, score, components]
      properties:
        status:
          $ref: '#/components/schemas/HealthState'
        score:
          type: integer
        components:
          type: array
          items:
            $ref: '#/components/schemas/HealthComponent'

    UPSConfig:
      type: object
      required: [names]
      properties:
        names:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 128

    ServerInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hostname:
          type: string
        version:
          type: string
        nasUuid:
          type: string
        timezone:
          type: string
        health:
          $ref: '#/components/schemas/HealthState'
        ip:
          type: string

    SystemMetrics:
      type: object
      properties:
        cpuPercent:
          type: number
        load:
          type: array
          items:
            type: number
        ramUsedBytes:
          type: integer
        ramTotalBytes:
          type: integer
        cpuTempC:
          type: number
        uptimeSeconds:
          type: integer
        net:
          type: object
          properties:
            interface:
              type: string
            upMbps:
              type: number
            downMbps:
              type: number
        netInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/NetInterfaceMetrics'
        filesystems:
          type: array
          items:
            $ref: '#/components/schemas/FilesystemUsage'

    SystemMetricSample:
      type: object
      required: [capturedAt, metrics]
      properties:
        capturedAt:
          type: string
          format: date-time
        metrics:
          $ref: '#/components/schemas/SystemMetrics'

    FilesystemUsage:
      type: object
      required: [path, totalBytes, usedBytes, availableBytes, usedPercent, state]
