        appdataArchives: {type: integer}
        warnings: {type: array, items: {type: string}}

    RecoveryStatus:
      type: object
      required: [configured, latestPath, verified]
      properties:
        configured: {type: boolean}
        latestPath: {type: string}
        verified: {type: boolean}
        manifest: {$ref: '#/components/schemas/RecoveryManifest'}
        warnings: {type: array, items: {type: string}}

    RecycleEntry:
      type: object
      required: [id, shareId, name, originalPath, deletedAt, sizeBytes]
      properties:
        id: {type: string}
        shareId: {type: string}
        name: {type: string}
        originalPath: {type: string}
        deletedAt: {type: string, format: date-time}
        sizeBytes: {type: integer, format: int64}

    RestorePlan:
      type: object
      required: [generationId, interfaces, apps, dataDisksNote]
      properties:
        generationId: {type: integer}
        interfaces: {type: array, items: {type: object}}
        apps: {type: array, items: {type: object}}
        dataDisksNote: {type: string}

    SSHKey:
      type: object
      required: [id, publicKey]
      properties:
        id: {type: string}
        publicKey: {type: string}
        comment: {type: string}

    StorageMount:
      type: object
      required: [kind, targetId, mountPath, fstype, source, options, enabled]
      properties:
        kind: {type: string, enum: [disk, pool]}
        targetId: {type: string}
        mountPath: {type: string}
        fstype: {type: string}
        source: {type: string}
        options: {type: string}
        enabled: {type: boolean}

    StorageSnapshot:
      type: object
      required: [id, kind, source, name, createdAt]
      properties:
        id: {type: string}
        kind: {type: string, enum: [btrfs, zfs]}
        source: {type: string}
        name: {type: string}
        label: {type: string}
        createdAt: {type: string, format: date-time}

    StorageOperationPlan:
      type: object
      required: [operationId, action, target, requestedState, dependencySnapshot, configGeneration, expiresAt, planHash, status]
      properties:
        operationId: {type: string}
        action: {type: string}
        target: {type: object}
        requestedState: {type: object, additionalProperties: true}
        dependencySnapshot: {type: array, items: {type: string}}
        configGeneration: {type: integer}
        expiresAt: {type: string, format: date-time}
        planHash: {type: string}
        status: {type: string}

    StorageSafety:
      type: object
      required: [state, unlockedUntil]
      properties:
        state: {type: string, enum: [locked, unlocked]}
        unlockedUntil: {type: string, format: date-time, nullable: true}

    TwoFactorSetup:
      type: object
      required: [secret, otpauthUri, recoveryCodes]
      properties:
        secret: {type: string}
        otpauthUri: {type: string}
        recoveryCodes: {type: array, items: {type: string}}

    UPSPolicy:
      type: object
      required: [enabled, minimumRuntimeSec, minimumCharge]
      properties:
        enabled: {type: boolean}
        minimumRuntimeSec: {type: integer}
        minimumCharge: {type: number}

    UPSStatus:
      type: object
      required: [name, status, onBattery]
      properties:
        name: {type: string}
        status: {type: string}
        manufacturer: {type: string}
        model: {type: string}
        serial: {type: string}
        chargePercent: {type: number}
        loadPercent: {type: number}
        runtimeSec: {type: number}
        onBattery: {type: boolean}

    UserGroup:
      type: object
      required: [id, name, members]
      properties:
        id: {type: string}
        name: {type: string}
        members: {type: array, items: {type: string}}

    WiFiScanResult:
      type: object
      required: [available, networks]
      properties:
        available: {type: boolean}
        networks:
          type: array
          items:
            type: object
            required: [ssid, signal, channel, security, secure]
            properties:
              ssid: {type: string}
              signal: {type: number}
              channel: {type: integer}
              band: {type: string}
              security: {type: string}
              secure: {type: boolean}
