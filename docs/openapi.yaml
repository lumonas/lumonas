openapi: 3.0.3
info:
  title: LumoNAS API
  description: |
    LumoNAS management daemon API. Provides endpoints for system monitoring,
    storage management, Docker orchestration, networking, backups, and administration.
  version: 0.1.0
  contact:
    name: LumoNAS
    url: https://github.com/lumonas/lumonas

servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development

tags:
  - name: System
    description: Server info, metrics, health
  - name: Storage
    description: Disks, pools, SnapRAID protection
  - name: Docker
    description: Stacks, containers, images, volumes
  - name: Shares
    description: File shares and access rules
  - name: Files
    description: File browser operations
  - name: Network
    description: Network configuration, VPN, firewall
  - name: Backups
    description: Backup destinations, jobs, recovery
  - name: Monitoring
    description: Alerts, notifications, schedules
  - name: Users
    description: User and group management
  - name: Settings
    description: System settings and updates
  - name: Auth
    description: Authentication and sessions
  - name: Health
    description: Health scoring and explanations

paths:
  /healthz:
    get:
      tags: [System]
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [System]
      summary: Readiness check
      operationId: readyz
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  /server:
    get:
      tags: [System]
      summary: Get server info
      operationId: getServer
      responses:
        '200':
          description: Server information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'

  /system/metrics:
    get:
      tags: [System]
      summary: Get system metrics
      operationId: getMetrics
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetrics'

  /system/metrics/history:
    get:
      tags: [System]
      summary: Get retained system metric samples
      operationId: getMetricsHistory
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10080
            default: 1440
      responses:
        '200':
          description: Newest retained metric samples first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemMetricSample'

  /health/components:
    get:
      tags: [Health]
      summary: Get health component breakdown
      operationId: getHealthComponents
      description: Returns detailed health score with per-component status and recommendations.
      responses:
        '200':
          description: Health breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthBreakdown'

  /disks:
    get:
      tags: [Storage]
      summary: List disks
      operationId: listDisks
      responses:
        '200':
          description: Disk list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disk'

  /disks/{id}:
    get:
      tags: [Storage]
      summary: Get disk by ID
      operationId: getDisk
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Disk details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disk'
        '404':
          description: Disk not found

  /pools:
    get:
      tags: [Storage]
      summary: List storage pools
      operationId: listPools
      responses:
        '200':
          description: Pool list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pool'

  /storage/protection:
    get:
      tags: [Storage]
      summary: Get SnapRAID protection status
      operationId: getProtection
      responses:
        '200':
          description: Protection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protection'

  /storage/protection/config:
    get:
      tags: [Storage]
      summary: Get the configured SnapRAID protection layout
      operationId: getProtectionConfig
      responses:
        '200':
          description: Configured parity and protected data disks
          content:
            application/json:
              schema:
                type: object
                properties:
                  configPath:
                    type: string
                  configured:
                    type: boolean
                  parityDiskIds:
                    type: array
                    items:
                      type: string
                  dataDiskIds:
                    type: array
                    items:
                      type: string
    put:
      tags: [Storage]
      summary: Generate and activate the managed SnapRAID configuration
      operationId: updateProtectionConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataDiskIds]
              properties:
                parityDiskId:
                  type: string
                dataDiskIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        '200':
          description: Activated configuration
        '422':
          description: Unknown disk identities or invalid layout

  /storage/mounts:
    get:
      tags: [Storage]
      summary: List persisted declarative mount entries
      operationId: storageMounts
      responses:
        '200':
          description: Persisted disk and pool mount state

  /storage/snapshots:
    get:
      tags: [Storage]
      summary: List storage snapshots
      operationId: listStorageSnapshots
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Snapshot records, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageSnapshot'
        '400':
          description: Invalid limit
    post:
      tags: [Storage]
      summary: Create a read-only storage snapshot
      operationId: createStorageSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, source]
              properties:
                kind:
                  type: string
                  enum: [btrfs, zfs]
                source:
                  type: string
                  description: Absolute subvolume path (btrfs) or dataset name (zfs)
                label:
                  type: string
      responses:
        '201':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSnapshot'
        '422':
          description: Invalid snapshot request or broker rejection
        '503':
          description: Privileged broker unavailable

  /storage/snapshots/{id}:
    delete:
      tags: [Storage]
      summary: Delete a storage snapshot
      operationId: deleteStorageSnapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauthenticated, storageSafetyUnlocked]
              properties:
                reauthenticated: {type: boolean}
                storageSafetyUnlocked: {type: boolean}
      responses:
        '200':
          description: Snapshot deleted
        '404':
          description: Snapshot not found
        '423':
          description: Reauthentication and Storage Safety unlock required
        '422':
          description: Privileged deletion failed
        '503':
          description: Privileged broker unavailable

  /storage/safety:
    get:
      tags: [Storage]
      summary: Get storage safety lock status
      operationId: getStorageSafety
      responses:
        '200':
          description: Safety status

  /storage/safety/unlock:
    post:
      tags: [Storage]
      summary: Unlock storage safety
      operationId: unlockStorageSafety
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Unlocked

  /storage/safety/lock:
    post:
      tags: [Storage]
      summary: Lock storage safety
      operationId: lockStorageSafety
      responses:
        '200':
          description: Locked

  /storage/pools/setup/plan:
    post:
      tags: [Storage]
      summary: Plan a first-run pool setup (format + mount + protection)
      operationId: planPoolSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, dataDiskIds]
              properties:
                name:
                  type: string
                dataDiskIds:
                  type: array
                  items:
                    type: string
                parityDiskId:
                  type: string
                filesystem:
                  type: string
                  enum: [ext4, xfs]
                formatDisks:
                  type: boolean
                  description: Force reformatting even when a usable filesystem is present
      responses:
        '201':
          description: Setup plan (bundle of reviewed steps; hash-confirmed once)
        '422':
          description: Invalid pool name or layout

  /storage/pools/setup/confirm:
    post:
      tags: [Storage]
      summary: Execute a confirmed pool setup plan
      operationId: confirmPoolSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId, planHash]
              properties:
                operationId:
                  type: string
                planHash:
                  type: string
                reauthenticated:
                  type: boolean
                storageSafetyUnlocked:
                  type: boolean
      responses:
        '202':
          description: Pool setup executed (protectionConfigured reports SnapRAID outcome)
        '409':
          description: Plan hash or identity revalidation failed
        '423':
          description: Reauthentication and storage safety unlock required

  /storage/operations/plan:
    post:
      tags: [Storage]
      summary: Plan a storage operation
      operationId: planStorageOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [filesystem.format, filesystem.create, filesystem.mount, filesystem.unmount, disk.erase]
                diskId:
                  type: string
                requestedState:
                  type: object
                  description: 'For filesystem.create: filesystem (ext4|xfs), mountPath (canonical branch path), optional label (max 12 chars).'
      responses:
        '201':
          description: Operation plan

  /storage/disks/{id}/retire:
    post:
      tags: [Storage]
      summary: Retire a known disk identity
      operationId: retireDisk
      description: >-
        Forget a disk identity from the inventory after a physical
        replacement. Stops the synthesized "disk missing" alert and lets the
        server health badge recover. Requires mutation rights.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Disk retired
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  retired:
                    type: boolean
        '404':
          description: Disk is not in the known inventory

  /storage/protection/replacement/plan:
    post:
      tags: [Storage]
      summary: Plan a protected data disk replacement
      operationId: planDiskReplacement
      description: >-
        Builds the reviewed sequence for swapping a failed SnapRAID data
        disk: the replacement takes over the retired disk's data slot name so
        parity recovery (snapraid fix) can restore its content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retiredDiskId, replacementDiskId]
              properties:
                retiredDiskId:
                  type: string
                replacementDiskId:
                  type: string
      responses:
        '201':
          description: Replacement plan
        '422':
          description: Retired disk not protected, replacement unsuitable, or config unreadable

  /storage/protection/replacement/confirm:
    post:
      tags: [Storage]
      summary: Execute a confirmed disk replacement
      operationId: confirmDiskReplacement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId, planHash]
              properties:
                operationId:
                  type: string
                planHash:
                  type: string
                reauthenticated:
                  type: boolean
                storageSafetyUnlocked:
                  type: boolean
      responses:
        '202':
          description: Replacement started; format + config applied, parity recovery queued
        '409':
          description: Plan hash or identity revalidation failed
        '423':
          description: Reauthentication and storage safety unlock required

  /docker/images/check-updates:
    post:
      tags: [Docker]
      summary: Compare local images against the registry
      operationId: checkImageUpdates
      description: >-
        Fetches manifest digests for locally present images (no image layers
        are pulled) and reports which ones have a newer build upstream. The
        result feeds the "updates available" counters.
      responses:
        '200':
          description: Images with update flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerImage'
        '503':
          description: Docker unavailable

  /docker/summary:
    get:
      tags: [Docker]
      summary: Docker summary
      operationId: dockerSummary
      responses:
        '200':
          description: Docker summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerSummary'

  /docker/stacks:
    get:
      tags: [Docker]
      summary: List Docker stacks
      operationId: listDockerStacks
      responses:
        '200':
          description: Stack list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerStack'
    post:
      tags: [Docker]
      summary: Create a Docker stack
      operationId: createDockerStack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                catalogId:
                  type: string
                values:
                  type: object
                storage:
                  type: array
                  items:
                    type: object
                composeYaml:
                  type: string
                env:
                  type: object
                  additionalProperties:
                    type: string
                deploy:
                  type: boolean
      responses:
        '201':
          description: Stack created

  /docker/deployments:
    get:
      tags: [Docker]
      summary: List Docker deployment transactions
      operationId: listDockerDeployments
      parameters:
        - name: stack
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Deployment history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerDeployment'
        '400':
          description: Invalid limit
        '500':
          description: Deployment history unavailable

  /docker/containers:
    get:
      tags: [Docker]
      summary: List Docker containers
      operationId: listDockerContainers
      responses:
        '200':
          description: Container list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerContainer'

  /docker/images:
    get:
      tags: [Docker]
      summary: List Docker images
      operationId: listDockerImages
      responses:
        '200':
          description: Image list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerImage'

  /docker/images/packs:
    get:
      tags: [Docker]
      summary: List validated offline Docker image packs
      operationId: listDockerImagePacks
      responses:
        '200':
          description: Valid image packs under the configured import root
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerImagePackSummary'
        '503':
          description: Image pack root unavailable

  /docker/volumes:
    get:
      tags: [Docker]
      summary: List Docker volumes
      operationId: listDockerVolumes
      responses:
        '200':
          description: Volume list

  /shares:
    get:
      tags: [Shares]
      summary: List managed shares
      operationId: listShares
      responses:
        '200':
          description: Share list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Share'
    post:
      tags: [Shares]
      summary: Create a share
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                path:
                  type: string
      responses:
        '201':
          description: Share created

  /files:
    get:
      tags: [Files]
      summary: List files
      operationId: listFiles
      parameters:
        - name: shareId
          in: query
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileEntry'

  /network/connections:
    get:
      tags: [Network]
      summary: List network connections
      operationId: listNetworkConnections
      responses:
        '200':
          description: Connection list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkConnection'
    post:
      tags: [Network]
      summary: Create or run network resource
      operationId: post-network-connections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
        '202':
          description: Accepted (async job queued)
        '4XX':
          description: Client error

  /network/interfaces:
    get:
      tags: [Network]
      summary: List network interfaces
      operationId: listNetworkInterfaces
      responses:
        '200':
          description: Interface list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkInterface'

  /network/wireguard/status:
    get:
      tags: [Network]
      summary: WireGuard status
      operationId: wireguardStatus
      responses:
        '200':
          description: WireGuard status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireGuardStatus'

  /network/wireguard/apply:
    post:
      tags: [Network]
      summary: Apply WireGuard configuration
      operationId: applyWireGuard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WireGuardConfig'
      responses:
        '200':
          description: Applied

  /network/wireguard/keygen:
    post:
      tags: [Network]
      summary: Generate WireGuard key pair
      operationId: wireguardKeygen
      responses:
        '200':
          description: Key pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  privateKey:
                    type: string
                  publicKey:
                    type: string

  /network/tailscale/status:
    get:
      tags: [Network]
      summary: Tailscale status
      operationId: tailscaleStatus
      responses:
        '200':
          description: Tailscale status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TailscaleStatus'

  /network/tailscale/up:
    post:
      tags: [Network]
      summary: Connect to Tailscale
      operationId: tailscaleUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                authKey:
                  type: string
      responses:
        '200':
          description: Connected

  /network/tailscale/down:
    post:
      tags: [Network]
      summary: Disconnect from Tailscale
      operationId: tailscaleDown
      responses:
        '200':
          description: Disconnected

  /network/tailscale/exit-node:
    post:
      tags: [Network]
      summary: Set Tailscale exit node
      operationId: tailscaleExitNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                peerIp:
                  type: string
                  description: Exit node IP, or empty to clear
      responses:
        '200':
          description: Updated

  /network/bindings:
    get:
      tags: [Network]
      summary: List service bindings
      operationId: listNetworkBindings
      responses:
        '200':
          description: Binding list
    patch:
      tags: [Network]
      summary: Update network resource
      operationId: patch-network-bindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
        '202':
          description: Accepted (async job queued)
        '4XX':
          description: Client error

  /network/firewall/policy:
    get:
      tags: [Network]
      summary: Get firewall policy
      operationId: getNetworkFirewall
      responses:
        '200':
          description: Firewall policy
    patch:
      tags: [Network]
      summary: Update network resource
      operationId: patch-network-firewall-policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
        '202':
          description: Accepted (async job queued)
        '4XX':
          description: Client error

  /backups/destinations:
    get:
      tags: [Backups]
      summary: List backup destinations
      operationId: listBackupDestinations
      responses:
        '200':
          description: Destination list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupDestination'
    post:
      tags: [Backups]
      summary: Create or run backup resource
      operationId: post-backups-destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
        '202':
          description: Accepted (async job queued)
        '4XX':
          description: Client error

  /backups/runs:
    get:
      tags: [Backups]
      summary: List backup runs
      operationId: listBackupRuns
      responses:
        '200':
          description: Run list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupRun'

  /backups/run:
    post:
      tags: [Backups]
      summary: Run backup now
      operationId: runBackup
      responses:
        '202':
          description: Backup started

  /backup/readiness:
    get:
      tags: [Backups]
      summary: Get recovery readiness score
      operationId: backupReadiness
      responses:
        '200':
          description: Recovery readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryReadiness'

  /backup/generations:
    get:
      tags: [Backups]
      summary: List config generations
      operationId: listGenerations
      responses:
        '200':
          description: Generation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigGeneration'

  /alerts:
    get:
      tags: [Monitoring]
      summary: List alerts
      operationId: listAlerts
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'

  /alerts/history:
    get:
      tags: [Monitoring]
      summary: List recently resolved alerts
      operationId: listAlertHistory
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Resolved alert history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
        '400':
          description: Invalid history limit

  /notification-channels:
    get:
      tags: [Monitoring]
      summary: List notification channels
      operationId: listNotificationChannels
      responses:
        '200':
          description: Channel list
    post:
      tags: [Monitoring]
      summary: Create or run notification channel
      operationId: post-notification-channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannelInput'
      responses:
        '200':
          description: OK
        '202':
          description: Accepted (async job queued)
        '4XX':
          description: Client error

  /users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      responses:
        '200':
          description: User list
    post:
      tags: [Users]
      summary: Create or run user
      operationId: post-users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
        '202':
          description: Accepted (async job queued)
        '4XX':
          description: Client error

  /users/{id}/passkeys:
    get:
      tags: [Users]
      summary: List registered passkeys
      operationId: listUserPasskeys
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Passkey metadata without private key material
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PasskeySummary'}
        '403': {description: The caller cannot view another user's passkeys}

  /users/{id}/passkeys/register/begin:
    post:
      tags: [Users]
      summary: Begin passkey registration
      operationId: beginUserPasskeyRegistration
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: WebAuthn creation options
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebAuthnOptionsEnvelope'}
        '403': {description: The caller cannot register for this user}

  /users/{id}/passkeys/register/finish:
    post:
      tags: [Users]
      summary: Finish passkey registration
      operationId: finishUserPasskeyRegistration
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
        - in: query
          name: name
          required: false
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '201': {description: Passkey registered}
        '409': {description: Ceremony expired or was already consumed}
        '422': {description: WebAuthn attestation failed}

  /users/{id}/passkeys/{credentialId}:
    delete:
      tags: [Users]
      summary: Remove a passkey
      operationId: deleteUserPasskey
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
        - in: path
          name: credentialId
          required: true
          schema: {type: string}
      responses:
        '204': {description: Passkey removed}
        '404': {description: Passkey not found}

