openapi: 3.0.3
info:
  title: LumoNAS API
  description: |
    LumoNAS management daemon API. Provides endpoints for system monitoring,
    storage management, Docker orchestration, networking, backups, and administration.
  version: 0.1.0
  contact:
    name: LumoNAS
    url: https://github.com/lumonas/lumonas

servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development

tags:
  - name: System
    description: Server info, metrics, health
  - name: Storage
    description: Disks, pools, SnapRAID protection
  - name: Docker
    description: Stacks, containers, images, volumes
  - name: Virtualization
    description: Host capabilities, local installer media, and virtual machines
  - name: Shares
    description: File shares and access rules
  - name: Files
    description: File browser operations
  - name: Network
    description: Network configuration, VPN, firewall
  - name: Backups
    description: Backup destinations, jobs, recovery
  - name: Monitoring
    description: Alerts, notifications, schedules
  - name: Users
    description: User and group management
  - name: Settings
    description: System settings and updates
  - name: Auth
    description: Authentication and sessions
  - name: Health
    description: Health scoring and explanations

paths:
  /virtualization/status:
    get:
      tags: [Virtualization]
      summary: Read host virtualization capabilities
      operationId: getVirtualizationStatus
      responses:
        '200':
          description: CPU, memory, KVM, and libvirt status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualizationStatus'}

  /virtualization/media:
    get:
      tags: [Virtualization]
      summary: List locally uploaded installer ISOs
      operationId: listVirtualizationMedia
      responses:
        '200':
          description: Available local installation media
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/VirtualizationMedia'}
    post:
      tags: [Virtualization]
      summary: Upload an installer ISO (maximum 8 GiB)
      operationId: uploadVirtualizationMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: ISO stored for local VM installation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualizationMedia'}
        '413': {description: Upload exceeds 8 GiB}
        '422': {description: Filename or media is invalid}

  /virtualization/vms:
    get:
      tags: [Virtualization]
      summary: List libvirt virtual machines
      operationId: listVirtualMachines
      responses:
        '200':
          description: VM inventory
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/VirtualMachine'}
        '503': {description: Libvirt inventory is unavailable}
    post:
      tags: [Virtualization]
      summary: Create and boot a VM installer
      operationId: createVirtualMachine
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVirtualMachine'}
      responses:
        '201':
          description: Guest defined and installer boot requested
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualMachine'}
        '422': {description: Resource budget, media, or VM definition is invalid}

  /virtualization/vms/{name}/action:
    post:
      tags: [Virtualization]
      summary: Request a graceful VM lifecycle action
      operationId: virtualMachineAction
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [start, shutdown, reboot, suspend, resume]}
      responses:
        '202':
          description: Lifecycle action accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualMachine'}
        '422': {description: Action or VM name is invalid}

  /virtualization/vms/{name}:
    delete:
      tags: [Virtualization]
      summary: Remove a stopped LumoNAS-managed VM
      operationId: deleteVirtualMachine
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmName, deleteDisk]
              properties:
                confirmName: {type: string}
                deleteDisk: {type: boolean, description: Permanently remove the VM's managed qcow2 disk}
      responses:
        '200':
          description: VM definition removed; response reports whether its disk was deleted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualMachineDeleteResult'}
        '400': {description: Name confirmation is invalid}
        '409': {description: VM is running, unmanaged, or its definition is unsafe}

  /virtualization/recoverable-vms:
    get:
      tags: [Virtualization]
      summary: List retained VM definitions and disks
      operationId: listRecoverableVirtualMachines
      responses:
        '200':
          description: VM definitions removed while retaining their recovery files
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RecoverableVirtualMachine'}
        '503': {description: Libvirt or managed image storage is unavailable}

  /virtualization/vms/{name}/restore-definition:
    post:
      tags: [Virtualization]
      summary: Verify a retained qcow2 disk and restore its VM definition
      operationId: restoreVirtualMachineDefinition
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'}}
      responses:
        '201':
          description: VM definition restored; guest remains shut off
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualMachine'}
        '409': {description: Saved disk or definition failed validation}

  /virtualization/vms/{name}/console:
    get:
      tags: [Virtualization]
      summary: Open or read a running VM serial console
      operationId: readVirtualMachineConsole
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'}}
        - {name: cursor, in: query, required: false, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: New serial output since the requested cursor
          content:
            application/json:
              schema:
                type: object
                required: [output, cursor, connected]
                properties:
                  output: {type: string}
                  cursor: {type: integer, minimum: 0}
                  connected: {type: boolean}
        '409': {description: VM is not running or console could not be opened}
    post:
      tags: [Virtualization]
      summary: Send keyboard input to the VM serial console
      operationId: writeVirtualMachineConsole
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: {type: string, maxLength: 4096}
      responses:
        '202': {description: Keyboard input accepted}
        '422': {description: Console is unavailable or input is invalid}
    delete:
      tags: [Virtualization]
      summary: Close a VM serial console
      operationId: closeVirtualMachineConsole
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'}}
      responses:
        '204': {description: Console closed}

  /virtualization/vms/{name}/snapshots:
    get:
      tags: [Virtualization]
      summary: List snapshots for a VM
      operationId: listVirtualMachineSnapshots
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Recovery points for this guest
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/VirtualMachineSnapshot'}}
        '503': {description: Snapshot inventory is unavailable}
    post:
      tags: [Virtualization]
      summary: Create a VM snapshot
      operationId: createVirtualMachineSnapshot
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'}
      responses:
        '201':
          description: Snapshot created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualMachineSnapshot'}
        '422': {description: Snapshot could not be created}

  /virtualization/vms/{name}/snapshots/{snapshot}:
    delete:
      tags: [Virtualization]
      summary: Delete a VM snapshot
      operationId: deleteVirtualMachineSnapshot
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: snapshot, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Snapshot deleted}
        '422': {description: Snapshot could not be deleted}

  /virtualization/vms/{name}/snapshots/{snapshot}/revert:
    post:
      tags: [Virtualization]
      summary: Restore a VM snapshot
      operationId: revertVirtualMachineSnapshot
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: snapshot, in: path, required: true, schema: {type: string}}
      responses:
        '202': {description: Snapshot restore request accepted}
        '422': {description: Snapshot could not be restored}

  /healthz:
    get:
      tags: [System]
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [System]
      summary: Readiness check
      operationId: readyz
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  /server:
    get:
      tags: [System]
      summary: Get server info
      operationId: getServer
      responses:
        '200':
          description: Server information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'

  /api-tokens:
    get:
      tags: [Auth]
      summary: List the current owner's scoped API tokens
      operationId: listApiTokens
      responses:
        '200':
          description: Token summaries; token material is never returned
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/APITokenSummary'}}
    post:
      tags: [Auth]
      summary: Create a scoped API token
      operationId: createApiToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items:
                    oneOf:
                      - {type: string, enum: [read, backup:write, replication:receive, fleet:status]}
                      - {type: string, pattern: '^workstation:backup:[A-Za-z0-9_-]{1,128}$'}
                expiresAt: {type: string, format: date-time}
      responses:
        '201':
          description: Token material is returned once only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APITokenCreated'}

  /api-tokens/{id}:
    delete:
      tags: [Auth]
      summary: Revoke an API token
      operationId: deleteApiToken
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204': {description: Revoked}

  /replication/peers:
    get:
      tags: [Backups]
      summary: List paired LumoNAS replication peers
      operationId: listReplicationPeers
      responses:
        '200':
          description: Peer status without credentials
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ReplicationPeer'}}
    post:
      tags: [Backups]
      summary: Pair an HTTPS LumoNAS recovery replica
      operationId: createReplicationPeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, token]
              properties:
                name: {type: string, minLength: 1}
                url: {type: string, format: uri, pattern: '^https://'}
                token: {type: string, description: Receive-only replication token}
                statusToken: {type: string, description: Optional fleet:status token for remote version and health}
      responses:
        '201': {description: Peer saved}

  /fleet/status:
    get:
      tags: [System]
      summary: Read minimal remote NAS version and health
      description: Intended for a narrowly scoped fleet:status API token. Does not return device identity or configuration.
      operationId: getFleetStatus
      responses:
        '200':
          description: Remote fleet status
          content:
            application/json:
              schema:
                type: object
                required: [status, version, health, checkedAt]
                properties:
                  status: {type: string, enum: [ok]}
                  version: {type: string}
                  health: {type: string}
                  checkedAt: {type: string, format: date-time}
        '401': {description: Authentication required}
        '403': {description: Token lacks fleet:status scope}

  /replication/peers/{id}:
    delete:
      tags: [Backups]
      summary: Remove a replication peer
      operationId: deleteReplicationPeer
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204': {description: Removed}

  /replication/peers/{id}/run:
    post:
      tags: [Backups]
      summary: Replicate the latest verified recovery bundle to a peer
      operationId: runReplicationPeer
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '202': {description: Replication accepted}

  /replication/receive:
    put:
      tags: [Backups]
      summary: Receive a recovery bundle from a paired peer
      description: Requires a bearer token scoped only to replication:receive.
      operationId: receiveReplication
      responses:
        '201': {description: Bundle stored as an offline replica}

  /replication/snapshot-tasks:
    get:
      tags: [Backups]
      summary: List native Btrfs snapshot replication tasks
      operationId: listSnapshotReplicationTasks
      parameters:
        - name: peerId
          in: query
          schema: {type: string}
      responses:
        '200': {description: Snapshot replication task configuration and latest state}
    post:
      tags: [Backups]
      summary: Create a snapshot replication task
      operationId: createSnapshotReplicationTask
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SnapshotReplicationTaskCreate'}
      responses:
        '201': {description: Task created}
        '422': {description: Invalid shares, schedule, or destination}

  /replication/snapshot-tasks/{id}:
    put:
      tags: [Backups]
      summary: Update a snapshot replication task name, schedule, or receive token
      operationId: updateSnapshotReplicationTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SnapshotReplicationTaskUpdate'}
      responses:
        '200': {description: Task updated}
        '409': {description: Task is running or configuration conflicts}
    delete:
      tags: [Backups]
      summary: Delete a snapshot replication task
      operationId: deleteSnapshotReplicationTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Task removed}
        '409': {description: Task is running}

  /replication/snapshot-tasks/{id}/run:
    post:
      tags: [Backups]
      summary: Start an incremental snapshot replication run
      operationId: runSnapshotReplicationTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '202': {description: Run accepted and associated with a job}
        '409': {description: Task already running}

  /replication/snapshot-tasks/{id}/cancel:
    post:
      tags: [Backups]
      summary: Cancel an active snapshot replication run
      operationId: cancelSnapshotReplicationTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '202': {description: Cancellation requested}
        '409': {description: No active run}

  /replication/snapshot-tasks/{id}/runs:
    get:
      tags: [Backups]
      summary: List recent snapshot replication run history
      operationId: listSnapshotReplicationRuns
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Recent progress, result, and error for each run}

  /replication/snapshots/{shareId}/receive:
    put:
      tags: [Backups]
      summary: Receive a Btrfs snapshot stream into one managed share
      description: Requires a replication:snapshot:receive:{shareId} token scoped to this destination share. The stream is SHA-256 verified before privileged receive.
      operationId: receiveBtrfsSnapshot
      parameters:
        - {name: shareId, in: path, required: true, schema: {type: string}}
        - {name: X-LumoNAS-Snapshot-Name, in: header, required: true, schema: {type: string}}
        - {name: X-LumoNAS-Snapshot-Parent, in: header, schema: {type: string}}
        - {name: X-LumoNAS-Snapshot-SHA256, in: header, required: true, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
        - {name: X-LumoNAS-Snapshot-Stream, in: header, required: true, schema: {type: string}}
        - {name: X-LumoNAS-Snapshot-Operation, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200': {description: Snapshot received and validated}
        '413': {description: Stream exceeded the size limit}
        '422': {description: Checksum, metadata, or Btrfs receive failed}

  /replication/snapshots/{shareId}/cancel:
    post:
      tags: [Backups]
      summary: Cancel an active receive operation for the scoped share
      operationId: cancelBtrfsSnapshotReceive
      parameters:
        - {name: shareId, in: path, required: true, schema: {type: string}}
        - {name: X-LumoNAS-Snapshot-Operation, in: header, required: true, schema: {type: string}}
      responses:
        '202': {description: Receiver cancellation requested}
        '409': {description: Operation is not active for this share}

  /system/metrics:
    get:
      tags: [System]
      summary: Get system metrics
      operationId: getMetrics
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetrics'

  /system/logs:
    get:
      tags: [System]
      summary: Search recent system and service journal entries
      operationId: getSystemLogs
      parameters:
        - {name: unit, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string, enum: [smb-audit]}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: since, in: query, schema: {type: string, maxLength: 40}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        '200': {description: Filtered journal entries}
        '422': {description: Unsupported service filter}
        '503': {description: System journal unavailable}

  /quotas:
    get:
      tags: [Storage]
      summary: List configured storage quotas with measured usage
      operationId: listStorageQuotas
      responses:
        '200': {description: Share, user, and group quota status}
        '503': {description: Usage scan was incomplete}
    put:
      tags: [Storage]
      summary: Replace storage quota policies
      operationId: replaceStorageQuotas
      responses:
        '200': {description: Saved quota policies}
        '422': {description: Invalid target or limit}

  /folder-sync/tasks:
    get:
      tags: [Backups]
      summary: List folder sync tasks
      operationId: listFolderSyncTasks
      responses:
        '200': {description: Folder sync tasks}
    post:
      tags: [Backups]
      summary: Create a folder sync task
      operationId: createFolderSyncTask
      responses:
        '200': {description: Saved task}
        '422': {description: Invalid endpoints or schedule}
  /folder-sync/tasks/{id}:
    put:
      tags: [Backups]
      summary: Replace a folder sync task
      operationId: updateFolderSyncTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Saved task}
    delete:
      tags: [Backups]
      summary: Delete an idle folder sync task
      operationId: deleteFolderSyncTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Deleted}
        '409': {description: Task has an active run}
  /folder-sync/tasks/{id}/preview:
    post:
      tags: [Backups]
      summary: Preview planned folder sync changes
      operationId: previewFolderSync
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Change plan and confirmation hash}
  /folder-sync/tasks/{id}/run:
    post:
      tags: [Backups]
      summary: Start a folder sync run
      operationId: runFolderSync
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '202': {description: Run accepted}
        '409': {description: Mirror preview is missing or stale}
  /folder-sync/tasks/{id}/runs:
    get:
      tags: [Backups]
      summary: List folder sync history
      operationId: listFolderSyncRuns
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Recent task runs}
  /folder-sync/tasks/{id}/runs/cancel:
    post:
      tags: [Backups]
      summary: Cancel an active folder sync
      operationId: cancelFolderSync
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '202': {description: Cancellation requested}
        '409': {description: No active run}

  /system/metrics/history:
    get:
      tags: [System]
      summary: Get retained system metric samples
      operationId: getMetricsHistory
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10080
            default: 1440
      responses:
        '200':
          description: Newest retained metric samples first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemMetricSample'

  /health/components:
    get:
      tags: [Health]
      summary: Get health component breakdown
      operationId: getHealthComponents
      description: Returns detailed health score with per-component status and recommendations.
      responses:
        '200':
          description: Health breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthBreakdown'

  /disks:
    get:
      tags: [Storage]
      summary: List disks
      operationId: listDisks
      responses:
        '200':
          description: Disk list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disk'

  /disks/{id}:
    get:
      tags: [Storage]
      summary: Get disk by ID
      operationId: getDisk
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Disk details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disk'
        '404':
          description: Disk not found

  /storage/disks/{id}/smart-history:
    get:
      tags: [Storage]
      summary: Get SMART history and trend for a disk
      operationId: getDiskSmartHistory
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 365, default: 30}
      responses:
        '200':
          description: SMART history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SMARTHistory'}

  /pools:
    get:
      tags: [Storage]
      summary: List storage pools
      operationId: listPools
      responses:
        '200':
          description: Pool list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pool'

  /storage/protection:
    get:
      tags: [Storage]
      summary: Get SnapRAID protection status
      operationId: getProtection
      responses:
        '200':
          description: Protection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protection'

  /storage/protection/config:
    get:
      tags: [Storage]
      summary: Get the configured SnapRAID protection layout
      operationId: getProtectionConfig
      responses:
        '200':
          description: Configured parity and protected data disks
          content:
            application/json:
              schema:
                type: object
                properties:
                  configPath:
                    type: string
                  configured:
                    type: boolean
                  parityDiskIds:
                    type: array
                    items:
                      type: string
                  dataDiskIds:
                    type: array
                    items:
                      type: string
    put:
      tags: [Storage]
      summary: Generate and activate the managed SnapRAID configuration
      operationId: updateProtectionConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataDiskIds]
              properties:
                parityDiskId:
                  type: string
                dataDiskIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        '200':
          description: Activated configuration
        '422':
          description: Unknown disk identities or invalid layout

  /storage/mounts:
    get:
      tags: [Storage]
      summary: List persisted declarative mount entries
      operationId: storageMounts
      responses:
        '200':
          description: Persisted disk and pool mount state

  /storage/snapshots:
    get:
      tags: [Storage]
      summary: List storage snapshots
      operationId: listStorageSnapshots
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Snapshot records, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageSnapshot'
        '400':
          description: Invalid limit
    post:
      tags: [Storage]
      summary: Create a read-only storage snapshot
      operationId: createStorageSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, source]
              properties:
                kind:
                  type: string
                  enum: [btrfs, zfs]
                source:
                  type: string
                  description: Absolute subvolume path (btrfs) or dataset name (zfs)
                label:
                  type: string
                retentionLockDays:
                  type: integer
                  minimum: 0
                  maximum: 3650
                  description: Prevent manual deletion and scheduled retention cleanup until this many days after creation.
      responses:
        '201':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSnapshot'
        '422':
          description: Invalid snapshot request or broker rejection
        '503':
          description: Privileged broker unavailable

  /storage/snapshots/{id}:
    delete:
      tags: [Storage]
      summary: Delete a storage snapshot
      operationId: deleteStorageSnapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauthenticated, storageSafetyUnlocked]
              properties:
                reauthenticated: {type: boolean}
                storageSafetyUnlocked: {type: boolean}
      responses:
        '200':
          description: Snapshot deleted
        '404':
          description: Snapshot not found
        '423':
          description: Reauthentication and Storage Safety unlock required, or the snapshot retention lock has not expired
        '422':
          description: Privileged deletion failed
        '503':
          description: Privileged broker unavailable

  /storage/snapshots/{id}/files:
    get:
      tags: [Storage]
      summary: Browse a read-only Btrfs snapshot directory
      operationId: browseStorageSnapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: Relative path inside the snapshot
      responses:
        '200':
          description: Snapshot directory entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSnapshotFiles'
        '404':
          description: Snapshot not found
        '422':
          description: Snapshot kind or path cannot be browsed
        '503':
          description: Privileged broker unavailable

  /storage/snapshots/{id}/compare:
    get:
      tags: [Storage]
      summary: Compare a Btrfs snapshot with its current managed share
      operationId: compareStorageSnapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bounded metadata diff between snapshot and current files
          content:
            application/json:
              schema:
                type: object
                required: [snapshotFiles, currentFiles, added, deleted, modified, unchanged, reviewRecommended, changes]
                properties:
                  snapshotFiles: {type: integer}
                  currentFiles: {type: integer}
                  added: {type: integer}
                  deleted: {type: integer}
                  modified: {type: integer}
                  unchanged: {type: integer}
                  reviewRecommended: {type: boolean}
                  changes:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [path, kind, sizeBytes, modifiedAt]
                      properties:
                        path: {type: string}
                        kind: {type: string, enum: [added, deleted, modified]}
                        sizeBytes: {type: integer, format: int64}
                        modifiedAt: {type: string, format: date-time}
        '404':
          description: Snapshot not found
        '422':
          description: Snapshot kind or comparison failed
        '503':
          description: Privileged broker unavailable

  /storage/snapshots/{id}/restore:
    post:
      tags: [Storage]
      summary: Queue a no-overwrite restore from a Btrfs snapshot into its managed share
      operationId: restoreStorageSnapshotEntries
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shareId, snapshotPath, targetPath, names]
              properties:
                shareId: {type: string}
                snapshotPath: {type: string, description: Relative folder in the snapshot}
                targetPath: {type: string, description: Existing relative folder in the same managed share}
                names: {type: array, minItems: 1, maxItems: 100, items: {type: string}}
      responses:
        '202': {description: Restore job queued}
        '400': {description: Invalid JSON}
        '403': {description: Snapshot does not belong to this share}
        '404': {description: Snapshot or share not found}
        '409': {description: Restore would overwrite existing entries}
        '422': {description: Snapshot kind or restore paths cannot be used}

  /storage/safety:
    get:
      tags: [Storage]
      summary: Get storage safety lock status
      operationId: getStorageSafety
      responses:
        '200':
          description: Safety status

  /storage/safety/unlock:
    post:
      tags: [Storage]
      summary: Unlock storage safety
      operationId: unlockStorageSafety
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Unlocked

  /storage/safety/lock:
    post:
      tags: [Storage]
      summary: Lock storage safety
      operationId: lockStorageSafety
      responses:
        '200':
          description: Locked

  /storage/pools/setup/plan:
    post:
      tags: [Storage]
      summary: Plan a first-run pool setup (format + mount + protection)
      operationId: planPoolSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, dataDiskIds]
              properties:
                name:
                  type: string
                dataDiskIds:
                  type: array
                  items:
                    type: string
                parityDiskId:
                  type: string
                filesystem:
                  type: string
                  enum: [ext4, xfs]
                formatDisks:
                  type: boolean
                  description: Force reformatting even when a usable filesystem is present
      responses:
        '201':
          description: Setup plan (bundle of reviewed steps; hash-confirmed once)
        '422':
          description: Invalid pool name or layout

  /storage/pools/membership/plan:
    post:
      tags: [Storage]
      summary: Plan growing a mounted pool with additional member disks
      operationId: planPoolMembership
      description: >-
        Seals which disks join an existing MergerFS pool, which of them need
        formatting, and the resulting branch list. Shrink/drain is not
        supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pool, addDiskIds]
              properties:
                pool:
                  type: string
                addDiskIds:
                  type: array
                  items:
                    type: string
                filesystem:
                  type: string
                  enum: [ext4, xfs]
                forceFormat:
                  type: boolean
      responses:
        '201':
          description: Membership plan
        '404':
          description: Pool is not mounted
        '422':
          description: Invalid grow request

  /storage/pools/membership/confirm:
    post:
      tags: [Storage]
      summary: Execute a confirmed pool membership plan
      operationId: confirmPoolMembership
      description: >-
        Formats new members, unmounts the pool, re-mounts over the full
        branch list, extends the managed SnapRAID layout with fresh data
        slots, and queues a sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId, planHash]
              properties:
                operationId:
                  type: string
                planHash:
                  type: string
                reauthenticated:
                  type: boolean
                storageSafetyUnlocked:
                  type: boolean
      responses:
        '202':
          description: Pool grown (protectionUpdated reports SnapRAID outcome)
        '404':
          description: Membership plan not found
        '409':
          description: Plan hash or identity revalidation failed
        '423':
          description: Reauthentication and storage safety unlock required

  /storage/pools/setup/confirm:
    post:
      tags: [Storage]
      summary: Execute a confirmed pool setup plan
      operationId: confirmPoolSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId, planHash]
              properties:
                operationId:
                  type: string
                planHash:
                  type: string
                reauthenticated:
                  type: boolean
                storageSafetyUnlocked:
                  type: boolean
      responses:
        '202':
          description: Pool setup executed (protectionConfigured reports SnapRAID outcome)
        '409':
          description: Plan hash or identity revalidation failed
        '423':
          description: Reauthentication and storage safety unlock required

  /storage/operations/plan:
    post:
      tags: [Storage]
      summary: Plan a storage operation
      operationId: planStorageOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [filesystem.format, filesystem.create, filesystem.mount, filesystem.unmount, disk.erase]
                diskId:
                  type: string
                requestedState:
                  type: object
                  description: 'For filesystem.create: filesystem (ext4|xfs), mountPath (canonical branch path), optional label (max 12 chars), and encrypted=true to use LUKS2. The passphrase is supplied only during confirmation and is never stored in the plan.'
      responses:
        '201':
          description: Operation plan

  /storage/disks/{id}/unlock:
    post:
      tags: [Storage]
      summary: Unlock and mount a LUKS encrypted disk
      operationId: unlockEncryptedDisk
      description: Requires mutation rights and an active storage safety window. The passphrase is sent to the privileged worker for this request only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: Encrypted volume unlocked and mounted
        '409':
          description: Disk identity changed or unlock failed
        '423':
          description: Storage safety window is locked

  /storage/disks/{id}/retire:
    post:
      tags: [Storage]
      summary: Retire a known disk identity
      operationId: retireDisk
      description: >-
        Forget a disk identity from the inventory after a physical
        replacement. Stops the synthesized "disk missing" alert and lets the
        server health badge recover. Requires mutation rights.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Disk retired
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  retired:
                    type: boolean
        '404':
          description: Disk is not in the known inventory

  /storage/protection/replacement/plan:
    post:
      tags: [Storage]
      summary: Plan a protected data disk replacement
      operationId: planDiskReplacement
      description: >-
        Builds the reviewed sequence for swapping a failed SnapRAID data
        disk: the replacement takes over the retired disk's data slot name so
        parity recovery (snapraid fix) can restore its content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retiredDiskId, replacementDiskId]
              properties:
                retiredDiskId:
                  type: string
                replacementDiskId:
                  type: string
      responses:
        '201':
          description: Replacement plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiskReplacementPlan'}
        '422':
          description: Retired disk not protected, replacement unsuitable, or config unreadable

  /storage/protection/replacement/confirm:
    post:
      tags: [Storage]
      summary: Execute a confirmed disk replacement
      operationId: confirmDiskReplacement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId, planHash]
              properties:
                operationId:
                  type: string
                planHash:
                  type: string
                reauthenticated:
                  type: boolean
                storageSafetyUnlocked:
                  type: boolean
      responses:
        '202':
          description: Replacement started; format + config applied, parity recovery queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiskReplacementResult'}
        '409':
          description: Plan hash or identity revalidation failed
        '423':
          description: Reauthentication and storage safety unlock required

  /docker/images/check-updates:
    post:
      tags: [Docker]
      summary: Compare local images against the registry
      operationId: checkImageUpdates
      description: >-
        Fetches manifest digests for locally present images (no image layers
        are pulled) and reports which ones have a newer build upstream. The
        result feeds the "updates available" counters.
      responses:
        '200':
          description: Images with update flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerImage'
        '503':
          description: Docker unavailable

  /docker/summary:
    get:
      tags: [Docker]
      summary: Docker summary
      operationId: dockerSummary
      responses:
        '200':
          description: Docker summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerSummary'

  /docker/stacks:
    get:
      tags: [Docker]
      summary: List Docker stacks
      operationId: listDockerStacks
      responses:
        '200':
          description: Stack list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerStack'
    post:
      tags: [Docker]
      summary: Create a Docker stack
      operationId: createDockerStack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                catalogId:
                  type: string
                values:
                  type: object
                storage:
                  type: array
                  items:
                    type: object
                composeYaml:
                  type: string
                env:
                  type: object
                  additionalProperties:
                    type: string
                deploy:
                  type: boolean
      responses:
        '201':
          description: Stack created

  /docker/deployments:
    get:
      tags: [Docker]
      summary: List Docker deployment transactions
      operationId: listDockerDeployments
      parameters:
        - name: stack
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Deployment history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerDeployment'
        '400':
          description: Invalid limit
        '500':
          description: Deployment history unavailable

  /docker/containers:
    get:
      tags: [Docker]
      summary: List Docker containers
      operationId: listDockerContainers
      responses:
        '200':
          description: Container list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerContainer'

  /docker/images:
    get:
      tags: [Docker]
      summary: List Docker images
      operationId: listDockerImages
      responses:
        '200':
          description: Image list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerImage'

  /docker/images/packs:
    get:
      tags: [Docker]
      summary: List validated offline Docker image packs
      operationId: listDockerImagePacks
      responses:
        '200':
          description: Valid image packs under the configured import root
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DockerImagePackSummary'
        '503':
          description: Image pack root unavailable

  /docker/volumes:
    get:
      tags: [Docker]
      summary: List Docker volumes
      operationId: listDockerVolumes
      responses:
        '200':
          description: Volume list

  /shares/storage-resources:
    get:
      tags: [Shares]
      summary: List currently mounted locations that can host shares
      operationId: listShareStorageResources
      responses:
        '200':
          description: Mounted pools and eligible data disks
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ShareStorageResource'}
        '503': {description: Storage discovery unavailable}

  /shares:
    get:
      tags: [Shares]
      summary: List managed shares
      operationId: listShares
      responses:
        '200':
          description: Share list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Share'
    post:
      tags: [Shares]
      summary: Create a share
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                path:
                  type: string
      responses:
        '201':
          description: Share created

  /files:
    get:
      tags: [Files]
      summary: List files
      operationId: listFiles
      parameters:
        - name: share
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                type: object
                required: [shareId, path, entries]
                properties:
                  shareId: {type: string}
                  path: {type: string}
                  entries:
                    type: array
                    items: {$ref: '#/components/schemas/FileEntry'}

  /network/connections:
    get:
      tags: [Network]
      summary: List network connections
      operationId: listNetworkConnections
      responses:
        '200':
          description: Connection list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkConnection'
    post:
      tags: [Network]
      summary: Create or run network resource
      operationId: post-network-connections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
        '202':
          description: Accepted (async job queued)
        '4XX':
          description: Client error

  /network/interfaces:
    get:
      tags: [Network]
      summary: List network interfaces
      operationId: listNetworkInterfaces
      responses:
        '200':
          description: Interface list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkInterface'

  /install/targets:
    get:
      tags: [Installer]
      summary: Review installation target disks (installer medium only)
      operationId: listInstallTargets
      responses:
        '200':
          description: Reviewed targets with protection reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstallTarget'
        '404':
          description: Not running from the installer medium

  /install/plan:
    post:
      tags: [Installer]
      summary: Generate an immutable installation plan
      operationId: createInstallPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetDiskId, hostname, adminUsername, filesystem]
              properties:
                targetDiskId: {type: string}
                hostname: {type: string}
                adminUsername: {type: string}
                filesystem: {type: string, enum: [ext4, xfs]}
                uefi: {type: boolean}
      responses:
        '201':
          description: Plan generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallPlanResponse'
        '422':
          description: Invalid request or protected target

  /install/apply:
    post:
      tags: [Installer]
      summary: Apply a confirmed installation plan
      operationId: applyInstallPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash, confirm, adminPassword]
              properties:
                hash: {type: string}
                confirm: {type: boolean}
                adminPassword: {type: string, format: password}
      responses:
        '200':
          description: Installation succeeded
        '409':
          description: No plan generated or another installation is already in progress
        '422':
          description: Plan validation or installation failure
        '503':
          description: Privileged broker unavailable

  /install/status:
    get:
      tags: [Installer]
      summary: Installation progress
      operationId: getInstallStatus
      responses:
        '200':
          description: Current installation stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallStatus'

  /network/lan/hosts:
    get:
      tags: [Network]
      summary: List discovered LAN hosts
      operationId: listLanHosts
      responses:
        '200':
          description: Known neighbors, most recently seen first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LanHost'

  /network/lan/scan:
    post:
      tags: [Network]
      summary: Run an on-demand LAN discovery pass
      operationId: scanLanHosts
      responses:
        '200':
          description: Refreshed neighbor inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LanHost'
        '503':
          description: Neighbor table unavailable

  /network/lan/hosts/wake:
    post:
      tags: [Network]
      summary: Send a Wake-on-LAN packet to a known host
      operationId: wakeLanHost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac, interface]
              properties:
                mac: {type: string}
                interface: {type: string}
      responses:
        '200':
          description: Wake packet sent
        '422':
          description: Invalid wake target
        '404':
          description: LAN host has not been discovered on this interface
        '503':
          description: Privileged broker unavailable

  /network/lan/hosts/rename:
    post:
      tags: [Network]
      summary: Attach an operator hostname to a known host
      operationId: renameLanHost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac, interface]
              properties:
                mac: {type: string}
                interface: {type: string}
                hostname: {type: string}
      responses:
        '200':
          description: Hostname stored
        '422':
          description: Invalid hostname
        '404':
          description: LAN host has not been discovered on this interface

  /network/wireguard/status:
    get:
      tags: [Network]
      summary: WireGuard status
      operationId: wireguardStatus
      responses:
        '200':
          description: WireGuard status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireGuardStatus'

  /network/wireguard/apply:
    post:
      tags: [Network]
      summary: Apply WireGuard configuration
      operationId: applyWireGuard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WireGuardConfig'
      responses:
        '200':
          description: Applied

  /network/wireguard/keygen:
    post:
      tags: [Network]
