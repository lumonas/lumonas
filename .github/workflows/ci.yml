name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: test -z "$(gofmt -l $(find cmd internal -name '*.go'))"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/lumonas-recover
      - run: python3 scripts/check-openapi.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: bash scripts/api-smoke.sh

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/compose-smoke.sh

  safety-recovery:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      # Keep the destructive-target and recovery invariants explicit: this
      # gate is required by release even though the backend job runs the full
      # suite as well.
      - run: >-
          go test -count=1
          ./cmd/lumonasd ./cmd/lumonas-privd ./internal/storage ./internal/recovery ./internal/privileged
          -run 'TestStoragePlanRequiresStableIdentityAndSafetyUnlock|TestPoolPlanPersistsAndRejectsReplacedDiskOnConfirmation|TestPoolPlanFailsClosedOnReorderedOrReplacedDisk|TestPlanRejectsExpiryMountAndGenerationRaces|TestApplyMountPersistenceRejectsStaleDiskIdentity|TestApplySnapraidConfigRevalidatesDiskIdentities|TestRecoveryStageRequiresConfirmationAndExtractsBundle|TestBundleRoundTripAndEncryptedPayload|TestBundleTamperingFailsVerification|TestUpdateAPIRequiresVerifiedRecoveryAndSupportsABHealthRollback|TestClientRoundTrip|TestPruneJobsKeepsActiveAndNewestTerminalHistory'

  storage-loopback:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs util-linux mount
      - run: sudo modprobe loop || true
      - run: sudo LUMONAS_STORAGE_ASSERT=true bash scripts/storage-loopback-smoke.sh

  race-fuzz:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./cmd/lumonasd ./cmd/lumonas-privd ./internal/backup ./internal/diagnostics ./internal/docker ./internal/network ./internal/recovery ./internal/storage
      - run: go test ./cmd/lumonasd ./cmd/lumonas-privd ./internal/backup ./internal/diagnostics ./internal/docker ./internal/network ./internal/recovery ./internal/storage -run 'Fuzz'

  package:
    runs-on: ubuntu-latest
    needs: [backend, frontend, runtime-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: bash packaging/build-deb.sh "${GITHUB_SHA::12}"
      - run: bash scripts/verify-deb.sh "$(find . -maxdepth 1 -type f -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-deb
          path: '*.deb'

  qemu-smoke:
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y debootstrap qemu-utils grub-pc-bin qemu-system-x86 curl
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: .
      - run: sudo LUMONAS_DEB="$PWD/$(ls *.deb | head -n1)" LUMONAS_QEMU_IMAGE="$PWD/build/qemu/lumonas-debian13.raw" bash scripts/qemu-build-image.sh
      - run: LUMONAS_QEMU_IMAGE="$PWD/build/qemu/lumonas-debian13.raw" LUMONAS_QEMU_LOG="$PWD/build/qemu/qemu-smoke.log" LUMONAS_QEMU_ASSERT=true bash scripts/qemu-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-qemu
          path: |
            build/qemu/lumonas-debian13.raw
            build/qemu/qemu-smoke.log*
          if-no-files-found: error

  iso:
    runs-on: ubuntu-latest
    needs: [qemu-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: .
      - run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso dpkg-dev qemu-system-x86 qemu-utils curl
      - run: sudo LUMONAS_DEB="$PWD/$(ls *.deb | head -n1)" bash installer/build-iso.sh "${GITHUB_SHA::12}"
      - run: LUMONAS_ISO="$PWD/build/releases/$(ls build/releases/*.iso | xargs -n1 basename)" LUMONAS_ISO_ASSERT=true LUMONAS_ISO_LOG="$PWD/build/iso-smoke.log" bash scripts/iso-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-iso
          path: build/releases/*
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-iso-smoke
          path: build/iso-smoke.log
          if-no-files-found: warn

  installer-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n installer/build-iso.sh packaging/build-deb.sh packaging/debian/postinst scripts/api-smoke.sh scripts/compose-smoke.sh scripts/iso-smoke.sh scripts/qemu-build-image.sh scripts/qemu-smoke.sh scripts/storage-loopback-smoke.sh scripts/upgrade-smoke.sh scripts/release-artifacts.sh scripts/verify-deb.sh
      - run: sh scripts/verify-packaging.sh
      - run: sh -n scripts/verify-release.sh
      - run: git diff --check

  upgrade-compatibility:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./internal/store -run 'TestStoreReopenPreservesStateAcrossMigrations|TestOpenMigratesLegacyEventSchema'

  upgrade-debian:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: build/current
      - name: Download previous release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git tag --sort=-version:refname | awk -v current="${GITHUB_REF_NAME}" '$0 != current { print; exit }')"
          test -n "$previous"
          mkdir -p build/previous
          gh release download "$previous" --pattern '*.deb' --dir build/previous
      - run: bash scripts/upgrade-smoke.sh "$(find build/previous -type f -name '*.deb' -print -quit)" "$(find build/current -type f -name '*.deb' -print -quit)"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package, qemu-smoke, iso, installer-scripts, safety-recovery, storage-loopback, compose-validation, upgrade-debian]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: build/releases
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-iso
          path: build/releases
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-qemu
          path: build/releases
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
      - run: LUMONAS_REQUIRE_SBOM=true LUMONAS_SIGN_ARTIFACTS=true bash scripts/release-artifacts.sh build/releases
      - run: LUMONAS_REQUIRE_SBOM=true LUMONAS_REQUIRE_SIGNATURES=true bash scripts/verify-release.sh build/releases
      - uses: softprops/action-gh-release@v2
        with:
          files: build/releases/*
