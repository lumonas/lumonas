name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: test -z "$(gofmt -l $(find cmd internal -name '*.go'))"
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: bash scripts/api-smoke.sh

  package:
    runs-on: ubuntu-latest
    needs: [backend, frontend, runtime-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: bash packaging/build-deb.sh "${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-deb
          path: '*.deb'

  qemu-smoke:
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y debootstrap qemu-utils grub-pc-bin qemu-system-x86 curl
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: .
      - run: sudo MYNAS_DEB="$PWD/$(ls *.deb | head -n1)" MYNAS_QEMU_IMAGE="$PWD/build/qemu/mynas-debian13.raw" bash scripts/qemu-build-image.sh
      - run: MYNAS_QEMU_IMAGE="$PWD/build/qemu/mynas-debian13.raw" MYNAS_QEMU_ASSERT=true bash scripts/qemu-smoke.sh

  iso:
    runs-on: ubuntu-latest
    needs: [qemu-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: .
      - run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso
      - run: sudo MYNAS_DEB="$PWD/$(ls *.deb | head -n1)" bash installer/build-iso.sh "${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-iso
          path: build/releases/*

  installer-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n installer/build-iso.sh packaging/build-deb.sh packaging/debian/postinst scripts/api-smoke.sh scripts/qemu-build-image.sh scripts/qemu-smoke.sh scripts/release-artifacts.sh
      - run: git diff --check

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package, qemu-smoke, iso, installer-scripts]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: build/releases
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-iso
          path: build/releases
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
      - run: MYNAS_REQUIRE_SBOM=true MYNAS_SIGN_ARTIFACTS=true bash scripts/release-artifacts.sh build/releases
      - uses: softprops/action-gh-release@v2
        with:
          files: build/releases/*
