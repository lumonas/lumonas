name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: test -z "$(gofmt -l $(find cmd internal -name '*.go'))"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/lumonas-recover
      - run: go build ./cmd/lumonas-migrate
      - run: python3 scripts/check-openapi.py
      - run: python3 scripts/check-openapi-duplicates.py
      - run: python3 scripts/check-api-contract.py
      - run: python3 scripts/validate-api-response.py --self-test
      - run: python3 scripts/validate-sse.py --self-test
      # The committed catalog signature must verify against the public key in
      # the shipped env example, so a tampered app catalog cannot ship.
      - run: make catalog-verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # pnpm must be installed before setup-node, because setup-node resolves the
      # pnpm store path itself when its pnpm cache is enabled.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build
      - run: bash ../scripts/frontend-runtime-smoke.sh

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # pnpm must be installed before setup-node, because setup-node resolves the
      # pnpm store path itself when its pnpm cache is enabled.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  frontend-live-e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:live

  workstation-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: LUMONAS_VERSION=ci bash scripts/build-workstation-clients.sh build/workstation-clients

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: LUMONAS_API_SMOKE_ASSERT=true bash scripts/api-smoke.sh

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/compose-smoke.sh

  docker-engine-api:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -count=1 ./internal/docker ./cmd/lumonas-privd -run 'TestEngineAPIReadOnlyCollectors|TestEngineAPIRejectsEngineErrors|TestSplitImageReference|TestContainerCPUPercent|TestImageUsageFallsBackToContainerReference|TestImageIDNormalization|TestVolumeUsageFailureKeepsInventory|TestValidateReadOnlyEnginePath|TestDockerCommandAllowList|TestDockerReadRequiresAllowListedPath|TestDockerReadRejectsOversizedOrMalformedResponses'

  share-integrations:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: bash scripts/share-config-smoke.sh
      - run: bash scripts/share-protocol-smoke.sh

  safety-recovery:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      # Keep the destructive-target and recovery invariants explicit: this
      # gate is required by release even though the backend job runs the full
      # suite as well.
      - run: >-
          go test -count=1
          ./cmd/lumonasd ./cmd/lumonas-privd ./internal/storage ./internal/recovery ./internal/privileged ./internal/updates
          -run 'TestStoragePlanRequiresStableIdentityAndSafetyUnlock|TestStorageConfirmationReportsPlanPersistenceFailure|TestWireGuardApplyUsesPrivilegedBroker|TestWireGuardMutationUsesNetworkWorkerAndTypedConfig|TestTailscaleUpUsesPrivilegedBroker|TestTailscaleMutationUsesNetworkWorker|TestPoolPlanPersistsAndRejectsReplacedDiskOnConfirmation|TestPoolPlanFailsClosedOnReorderedOrReplacedDisk|TestPoolSetupPlanRejectsSanitizedBranchCollision|TestPlanRejectsExpiryMountAndGenerationRaces|TestApplyMountPersistenceRejectsStaleDiskIdentity|TestApplySnapraidConfigRevalidatesDiskIdentities|TestRenderSnapraidConfigRejectsUnstableOrCollidingIdentities|TestValidateSnapraidConfigRejectsBranchCollisions|TestReplacementPlanRejectsUnstableReplacementIdentity|TestReplacementPlanRejectsAmbiguousSanitizedBranch|TestReplacementPlanRejectsTamperedHash|TestDiskReplacementPlanAndConfirmChain|TestExecuteRequiresOperationIDForConfirmedStorageMutation|TestExecuteRequiresOperationIDForFirewallMutation|TestShareActivationRequiresOperationID|TestRemainingMutationsRequireOperationID|TestDestructiveStorageExecutionFailsClosedForMissingOrMountedDisk|TestDestructiveStorageExecutionFailsClosedWhenFindmntReportsMount|TestSnapraidMutationsFailClosedWhenCommandFails|TestFirewallActivationFailsClosedWithoutBroker|TestReloadShareServicesFailsClosedWithoutPrivilegedBroker|TestRecoveryStageRequiresConfirmationAndExtractsBundle|TestBundleRoundTripAndEncryptedPayload|TestBundleTamperingFailsVerification|TestUpdateAPIRequiresVerifiedRecoveryAndSupportsABHealthRollback|TestClientRoundTrip|TestClientRejectsOversizedResponse|TestBrokerRejectsOversizedWorkerResponse|TestRecoveryExportFailsClosedWhenDiskIdentityCollectionFails|TestRecoveryExportRequiresNASIdentity|TestPruneJobsKeepsActiveAndNewestTerminalHistory|TestEnsureRestartedJobsFailsClosedForInterruptedWork|TestFailInterruptedBackupRunsClosesRunsAndCopies|TestBackupCompletionEventRequiresDurableState|TestBackupDoesNotStartWhenRunningStateCannotPersist|TestJobResourceKeyGroupsMutuallyExclusiveWork|TestAdmitJobRejectsConflictingActiveResource|TestAdmitJobAllowsTerminalAndDifferentDiskJobs|TestStreamReplaysEventsAfterLastEventID|TestABManagerStagesAndRollsBackAtomically|TestUpdateAPIRequiresVerifiedRecoveryAndSupportsABHealthRollback|TestRunDueSchedulesFiresSnapshotScheduleAndPersistsOrigin|TestSlotWriteRejectsOutsideUpdateRoot|TestSlotWriteRejectsNonBlockTarget|TestSlotWriteVerifiesDigestBeforeWrite|TestSlotWriteFailsClosedWhenMountStateUnknown|TestSlotBootNextValidatesEntryAndRequiresEfibootmgr|TestSlotOperationsAreMutationsOnStorageWorker|TestSlotWriteRejectsCharacterDevice|TestExecuteSlotWriteFailsClosedOnMountDiscovery|TestStageSlotImageStagesVerifiedImageForInactiveSlot|TestStageSlotImageRejectsTamperedImage|TestStagedSlotImageDetectsDrift|TestStagedSlotImageRequiresStaging|TestValidateSlotBootEntry|TestCommitSlotImageRejectsWrongHealthVersion|TestParseSlotDeviceMappingRejectsUnsafeAndDuplicateEntries|TestSlotAPIStagesActivatesAndConfirmsSignedImage|TestReconcileUpdateBootArmsPreviousSlotBeforeAutomaticReboot'
      - run: go test ./cmd/lumonasd -run 'TestPublishActorSetsEventEnvelopeWithoutPayloadMutation'
      - run: go test -count=1 ./cmd/lumonas-privd ./internal/updates -run 'TestSlotWriteRejectsPartitionTarget|TestValidateSlotDevicePathRequiresPersistentAlias'
      - run: go test -count=1 ./cmd/lumonas-privd -run 'TestFilesystemMutationValidatesRequestedStateBeforeDiscovery'
      - run: bash scripts/disk-identity-smoke.sh
      - run: bash scripts/recovery-bundle-smoke.sh
      - run: bash scripts/recovery-persistence-smoke.sh

  recovery-api:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: bash scripts/recovery-api-smoke.sh

  storage-loopback:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs xfsprogs util-linux mount mergerfs snapraid
      - run: sudo modprobe loop || true
      - run: sudo LUMONAS_STORAGE_ASSERT=true bash scripts/storage-loopback-smoke.sh

  privileged-storage-loopback:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs util-linux mount
      - run: sudo modprobe loop || true
      - run: sudo LUMONAS_PRIVILEGED_STORAGE_ASSERT=true bash scripts/privileged-storage-loopback-smoke.sh

  disk-full:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs util-linux mount
      - run: sudo modprobe loop || true
      - run: sudo LUMONAS_DISK_FULL_ASSERT=true bash scripts/disk-full-smoke.sh

  race-fuzz:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: LUMONAS_FUZZ_TIME=5s bash scripts/race-fuzz-smoke.sh

  security-controls:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: bash scripts/security-smoke.sh
      - run: go test -count=1 ./cmd/lumonas-privd -run 'TestPeerAllowedRejectsNonUnixConnections|TestPeerAllowedAcceptsCurrentUnixPeer|TestPeerAllowedRejectsUnixPeerOutsideServiceGroup'
      - run: bash scripts/secret-scan-smoke.sh
      - run: bash scripts/command-boundary-smoke.sh
      - run: bash scripts/request-limits-smoke.sh
      - run: bash scripts/retention-smoke.sh
      - run: bash scripts/generation-retention-smoke.sh

  dependency-controls:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install pinned govulncheck
        run: GOBIN="$RUNNER_TEMP/lumonas-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run dependency checks
        run: PATH="$RUNNER_TEMP/lumonas-tools:$PATH" LUMONAS_REQUIRE_DEPENDENCY_TOOLS=true bash scripts/dependency-smoke.sh
      - name: Pull pinned Trivy scanner
        run: docker pull aquasec/trivy:0.58.1
      - name: Verify every catalog image still resolves
        run: LUMONAS_CATALOG_IMAGES_REQUIRED=true bash scripts/catalog-image-availability.sh
      - name: Scan repository and catalog images
        run: LUMONAS_CONTAINER_SCAN_REQUIRED=true bash scripts/container-image-scan.sh

  package:
    runs-on: ubuntu-latest
    needs: [backend, frontend, runtime-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: LUMONAS_GIT_COMMIT="$GITHUB_SHA" make package VERSION="${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-deb
          path: '*.deb'

  package-arm64:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross dpkg-dev
      - run: >-
          LUMONAS_DEB_ARCH=arm64
          LUMONAS_CC=aarch64-linux-gnu-gcc
          LUMONAS_GIT_COMMIT="$GITHUB_SHA"
          make package-arm64 VERSION="${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-deb-arm64
          path: '*.deb'

  deb-verify-arm64:
    runs-on: ubuntu-latest
    needs: [package-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb-arm64
          path: build/package
      - run: LUMONAS_DEB_ARCH=arm64 bash scripts/verify-deb.sh "$(find build/package -type f -name '*.deb' -print -quit)"

  qemu-smoke:
    runs-on: ubuntu-latest
    needs: [package, deb-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y debootstrap qemu-utils grub-pc-bin qemu-system-x86 curl python3 dosfstools util-linux ovmf
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: .
      - name: Create ephemeral QEMU SSH key
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/lumonas-qemu-ssh"
          printf 'LUMONAS_QEMU_SSH_PUBLIC_KEY=%s\n' "$(cat "$RUNNER_TEMP/lumonas-qemu-ssh.pub")" >> "$GITHUB_ENV"
      - name: Build signed update fixture
        run: |
          go build -trimpath -o "$RUNNER_TEMP/lumonas-update-fixture" ./cmd/lumonas-update-fixture
          "$RUNNER_TEMP/lumonas-update-fixture" -dir "$RUNNER_TEMP/lumonas-update" -output "$RUNNER_TEMP/lumonas-update-fixture.json"
      - run: sudo env LUMONAS_DEB="$PWD/$(ls *.deb | head -n1)" LUMONAS_UPDATE_FIXTURE="$RUNNER_TEMP/lumonas-update-fixture.json" LUMONAS_QEMU_SSH_PUBLIC_KEY="$LUMONAS_QEMU_SSH_PUBLIC_KEY" LUMONAS_QEMU_IMAGE="$PWD/build/qemu/lumonas-debian13.raw" bash scripts/qemu-build-image.sh
        env:
          RUNNER_TEMP: ${{ runner.temp }}
      - run: LUMONAS_QEMU_IMAGE="$PWD/build/qemu/lumonas-debian13.raw" LUMONAS_QEMU_SSH_PRIVATE_KEY="$RUNNER_TEMP/lumonas-qemu-ssh" LUMONAS_QEMU_SSH_ASSERT=true LUMONAS_QEMU_UPDATE_FIXTURE="$RUNNER_TEMP/lumonas-update-fixture.json" LUMONAS_QEMU_UPDATE_ASSERT=true LUMONAS_QEMU_LOG="$PWD/build/qemu/qemu-smoke.log" LUMONAS_QEMU_ASSERT=true bash scripts/qemu-smoke.sh
      - run: LUMONAS_AB_ASSERT=true LUMONAS_QEMU_IMAGE="$PWD/build/qemu/lumonas-debian13.raw" LUMONAS_QEMU_SSH_KEY="$RUNNER_TEMP/lumonas-qemu-ssh" LUMONAS_AB_SSH_PORT=18023 bash scripts/qemu-ab-smoke.sh
      - run: LUMONAS_UEFI_AB_ASSERT=true LUMONAS_QEMU_IMAGE="$PWD/build/qemu/lumonas-debian13.raw" LUMONAS_QEMU_SSH_KEY="$RUNNER_TEMP/lumonas-qemu-ssh" LUMONAS_UEFI_AB_SSH_PORT=18024 LUMONAS_UEFI_AB_WEB_PORT=18025 bash scripts/qemu-uefi-ab-smoke.sh
      - name: Remove ephemeral QEMU SSH access
        if: always()
        run: |
          test -f "$PWD/build/qemu/lumonas-debian13.raw" || exit 0
          clean_mount="$RUNNER_TEMP/lumonas-qemu-clean"
          sudo mkdir -p "$clean_mount"
          sudo mount -o loop "$PWD/build/qemu/lumonas-debian13.raw" "$clean_mount"
          sudo rm -f "$clean_mount/root/.ssh/authorized_keys"
          sudo rmdir "$clean_mount/root/.ssh" 2>/dev/null || true
          sudo rm -f "$clean_mount/etc/systemd/system/multi-user.target.wants/ssh.service"
          sudo rm -f "$clean_mount/var/lib/lumonas/update-fixture/package"
          sudo rmdir "$clean_mount/var/lib/lumonas/update-fixture" 2>/dev/null || true
          sudo sed -i '/^LUMONAS_UPDATE_PUBLIC_KEY=/d' "$clean_mount/etc/lumonas/lumonasd.env"
          sudo umount "$clean_mount"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumonas-qemu
          path: |
            build/qemu/lumonas-debian13.raw
            build/qemu/qemu-smoke.log*
          if-no-files-found: warn

  package-permissions:
    runs-on: ubuntu-latest
    needs: [package, deb-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: build/package
      - run: bash scripts/permission-smoke.sh "$(find build/package -type f -name '*.deb' -print -quit)"

  deb-verify:
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: build/package
      - run: bash scripts/verify-deb.sh "$(find build/package -type f -name '*.deb' -print -quit)"

  iso:
    runs-on: ubuntu-latest
    needs: [qemu-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-qemu
          path: build/qemu
      - run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso dpkg-dev gnupg qemu-system-x86 qemu-utils curl python3
      - run: go build -trimpath -o "$RUNNER_TEMP/lumonas-recovery-fixture" ./cmd/lumonas-recovery-fixture
      - run: go build -trimpath -o "$RUNNER_TEMP/lumonas-recover" ./cmd/lumonas-recover
      - name: Import ISO repository signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          LUMONAS_REPO_PRIVATE_KEY: ${{ secrets.LUMONAS_REPO_PRIVATE_KEY }}
          LUMONAS_REPO_SIGN_KEY: ${{ secrets.LUMONAS_REPO_SIGN_KEY }}
        run: |
          test -n "$LUMONAS_REPO_PRIVATE_KEY"
          test -n "$LUMONAS_REPO_SIGN_KEY"
          export GNUPGHOME="$RUNNER_TEMP/lumonas-repo-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$LUMONAS_REPO_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$LUMONAS_REPO_SIGN_KEY" >/dev/null
          echo "LUMONAS_REPO_GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - run: sudo env LUMONAS_DEB="$PWD/$(ls *.deb | head -n1)" LUMONAS_ENABLE_RECOVERY_SMOKE=true LUMONAS_REPO_SIGN_KEY="${LUMONAS_REPO_SIGN_KEY}" LUMONAS_REQUIRE_REPO_SIGNATURE="${LUMONAS_REQUIRE_REPO_SIGNATURE}" LUMONAS_REPO_GNUPGHOME="${LUMONAS_REPO_GNUPGHOME}" bash installer/build-iso.sh "${GITHUB_SHA::12}"
        env:
          LUMONAS_REPO_SIGN_KEY: ${{ secrets.LUMONAS_REPO_SIGN_KEY }}
          LUMONAS_REQUIRE_REPO_SIGNATURE: ${{ startsWith(github.ref, 'refs/tags/') }}
      - run: LUMONAS_ISO="$PWD/build/releases/$(ls build/releases/*.iso | xargs -n1 basename)" LUMONAS_ISO_ASSERT=true LUMONAS_ISO_LOG="$PWD/build/iso-smoke.log" bash scripts/iso-smoke.sh
      - run: LUMONAS_ISO="$PWD/build/releases/$(ls build/releases/*.iso | xargs -n1 basename)" LUMONAS_INSTALLER_ASSERT=true LUMONAS_INSTALLER_CONTRACT_ASSERT=true LUMONAS_INSTALLER_DEBUG_DIR="$PWD/build/qemu/installer-debug" LUMONAS_INSTALLER_LIVE_LOG="$PWD/build/qemu-installer-live.log" LUMONAS_INSTALLER_INSTALLED_LOG="$PWD/build/qemu-installer-installed.log" bash scripts/qemu-installer-smoke.sh
      - run: |
          source_image="$(find "$PWD/build/qemu" -type f -name '*.raw' -print -quit)"
          test -n "$source_image"
          sudo env LUMONAS_ISO="$PWD/build/releases/$(ls build/releases/*.iso | xargs -n1 basename)" LUMONAS_RECOVERY_ASSERT=true LUMONAS_RECOVERY_SOURCE_IMAGE="$source_image" LUMONAS_RECOVERY_FIXTURE="$RUNNER_TEMP/lumonas-recovery-fixture" LUMONAS_RECOVER_BIN="$RUNNER_TEMP/lumonas-recover" LUMONAS_RECOVERY_LOG="$PWD/build/qemu-recovery.log" LUMONAS_RECOVERY_DEBUG_DIR="$PWD/build/qemu/recovery-debug" bash scripts/qemu-recovery-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-iso
          path: build/releases/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumonas-iso-smoke
          path: |
            build/iso-smoke.log
            build/qemu-installer-live.log
            build/qemu-installer-installed.log
            build/qemu-recovery.log
            build/qemu/recovery-debug/**
            build/qemu/installer-debug/**
          if-no-files-found: warn

  installer-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n installer/build-iso.sh installer/build-arm64.sh installer/build-netboot.sh packaging/build-deb.sh packaging/debian/postinst packaging/debian/prerm scripts/api-smoke.sh scripts/compose-smoke.sh scripts/container-image-scan.sh scripts/dependency-smoke.sh scripts/disk-full-smoke.sh scripts/disk-identity-smoke.sh scripts/frontend-runtime-smoke.sh scripts/fuzz-smoke.sh scripts/iso-smoke.sh scripts/qemu-ab-smoke.sh scripts/qemu-uefi-ab-smoke.sh scripts/qemu-build-image.sh scripts/qemu-smoke.sh scripts/qemu-installer-smoke.sh scripts/qemu-recovery-smoke.sh scripts/qemu-live-recovery-source.sh scripts/recovery-api-smoke.sh scripts/recovery-bundle-smoke.sh scripts/recovery-persistence-smoke.sh scripts/request-limits-smoke.sh scripts/security-smoke.sh scripts/secret-scan-smoke.sh scripts/command-boundary-smoke.sh scripts/storage-loopback-smoke.sh scripts/privileged-storage-loopback-smoke.sh scripts/systemd-smoke.sh scripts/permission-smoke.sh scripts/postinst-policy-smoke.sh scripts/log-retention-smoke.sh scripts/log-identity-smoke.sh scripts/retention-smoke.sh scripts/generation-retention-smoke.sh scripts/share-protocol-smoke.sh scripts/upgrade-smoke.sh scripts/upgrade-service-order-smoke.sh scripts/build-workstation-clients.sh scripts/release-artifacts.sh scripts/release-artifacts-smoke.sh scripts/installer-signature-policy-smoke.sh scripts/installer-workdir-policy-smoke.sh scripts/verify-deb.sh scripts/verify-release.sh scripts/arm64-image-smoke.sh scripts/netboot-smoke.sh
      - run: make arm64-image-smoke netboot-smoke
      - run: bash scripts/upgrade-service-order-smoke.sh
      - run: bash scripts/release-artifacts-smoke.sh
      - run: bash scripts/installer-signature-policy-smoke.sh
      - run: bash scripts/installer-workdir-policy-smoke.sh
      - run: bash scripts/installer-install-policy-smoke.sh
      - run: bash scripts/postinst-policy-smoke.sh
      - run: bash scripts/release-gate-policy-smoke.sh
      - run: bash scripts/package-dependency-parity-smoke.sh
      - run: bash scripts/command-boundary-smoke.sh
      - run: bash -n scripts/interop/*.sh
      - run: bash scripts/interop/run-all.sh
      - run: python3 scripts/check-api-contract.py
      - run: bash scripts/log-retention-smoke.sh
      - run: bash scripts/log-identity-smoke.sh
      - run: LUMONAS_REQUIRE_SYSTEMD_VERIFY=true LUMONAS_REQUIRE_SYSTEMD_SECURITY=true sh scripts/verify-packaging.sh
      - run: LUMONAS_REQUIRE_SYSTEMD_SECURITY=true bash scripts/systemd-security-smoke.sh
      - run: sh -n scripts/verify-release.sh
      - run: git diff --check

  upgrade-compatibility:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./internal/store -run 'TestStoreReopenPreservesStateAcrossMigrations|TestOpenMigratesLegacyEventSchema|TestOpenMigratesLegacyJobObservabilitySchema|TestOpenMigratesLegacyLanHostSchema|TestOpenMigratesLegacyRuntimeSchemaAsOneUpgrade|TestOpenMigratesLegacyBackupRunActorColumn|TestStorageSnapshotMigrationAddsOriginAndPreservesRows'

  upgrade-debian:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package, deb-verify]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: build/current
      - name: Download previous release package
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git tag --sort=-version:refname | awk -v current="${GITHUB_REF_NAME}" '$0 != current { print; exit }')"
          if [ -z "$previous" ]; then
            echo "No previous release tag is available; upgrade smoke is not applicable to the first release."
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_previous=true" >> "$GITHUB_OUTPUT"
          mkdir -p build/previous
          gh release download "$previous" --pattern '*.deb' --dir build/previous
      - if: steps.previous.outputs.has_previous == 'true'
        run: bash scripts/upgrade-smoke.sh "$(find build/previous -type f -name '*.deb' -print -quit)" "$(find build/current -type f -name '*.deb' -print -quit)"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package, package-permissions, deb-verify, package-arm64, deb-verify-arm64, qemu-smoke, iso, installer-scripts, frontend-e2e, frontend-live-e2e, workstation-clients, safety-recovery, recovery-api, storage-loopback, privileged-storage-loopback, disk-full, share-integrations, compose-validation, docker-engine-api, security-controls, dependency-controls, race-fuzz, upgrade-compatibility, upgrade-debian]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: build/releases
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-iso
          path: build/releases
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-qemu
          path: build/releases
      - name: Build workstation backup clients
        env:
          LUMONAS_VERSION: ${{ github.ref_name }}
        run: bash scripts/build-workstation-clients.sh build/releases
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
      - run: LUMONAS_REQUIRE_SBOM=true LUMONAS_SIGN_ARTIFACTS=true bash scripts/release-artifacts.sh build/releases
      - name: Compute release source timestamp
        run: echo "LUMONAS_EXPECTED_SOURCE_DATE_EPOCH=$(git show -s --format=%ct \"$GITHUB_SHA\")" >> "$GITHUB_ENV"
      - name: Verify release signatures and provenance
        env:
          LUMONAS_REQUIRE_SBOM: true
          LUMONAS_REQUIRE_SIGNATURES: true
          LUMONAS_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          LUMONAS_COSIGN_CERTIFICATE_IDENTITY_REGEXP: "${{ github.server_url }}/${{ github.repository }}/.github/workflows/.+@refs/tags/${{ github.ref_name }}"
          LUMONAS_COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: LUMONAS_REQUIRE_RELEASE_SET=true bash scripts/verify-release.sh build/releases
      - uses: softprops/action-gh-release@v2
        with:
          files: build/releases/*
