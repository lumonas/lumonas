name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: test -z "$(gofmt -l $(find cmd internal -name '*.go'))"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/lumonas-recover
      - run: go build ./cmd/lumonas-migrate
      - run: python3 scripts/check-openapi.py
      - run: python3 scripts/check-api-contract.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build
      - run: bash ../scripts/frontend-runtime-smoke.sh

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: LUMONAS_API_SMOKE_ASSERT=true bash scripts/api-smoke.sh

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/compose-smoke.sh

  share-integrations:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: bash scripts/share-config-smoke.sh

  safety-recovery:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      # Keep the destructive-target and recovery invariants explicit: this
      # gate is required by release even though the backend job runs the full
      # suite as well.
      - run: >-
          go test -count=1
          ./cmd/lumonasd ./cmd/lumonas-privd ./internal/storage ./internal/recovery ./internal/privileged
          -run 'TestStoragePlanRequiresStableIdentityAndSafetyUnlock|TestPoolPlanPersistsAndRejectsReplacedDiskOnConfirmation|TestPoolPlanFailsClosedOnReorderedOrReplacedDisk|TestPlanRejectsExpiryMountAndGenerationRaces|TestApplyMountPersistenceRejectsStaleDiskIdentity|TestApplySnapraidConfigRevalidatesDiskIdentities|TestExecuteRequiresOperationIDForConfirmedStorageMutation|TestDestructiveStorageExecutionFailsClosedForMissingOrMountedDisk|TestDestructiveStorageExecutionFailsClosedWhenFindmntReportsMount|TestSnapraidMutationsFailClosedWhenCommandFails|TestRecoveryStageRequiresConfirmationAndExtractsBundle|TestBundleRoundTripAndEncryptedPayload|TestBundleTamperingFailsVerification|TestUpdateAPIRequiresVerifiedRecoveryAndSupportsABHealthRollback|TestClientRoundTrip|TestPruneJobsKeepsActiveAndNewestTerminalHistory'

  recovery-api:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: bash scripts/recovery-api-smoke.sh

  storage-loopback:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs xfsprogs util-linux mount mergerfs snapraid
      - run: sudo modprobe loop || true
      - run: sudo LUMONAS_STORAGE_ASSERT=true bash scripts/storage-loopback-smoke.sh

  privileged-storage-loopback:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs util-linux mount
      - run: sudo modprobe loop || true
      - run: sudo LUMONAS_PRIVILEGED_STORAGE_ASSERT=true bash scripts/privileged-storage-loopback-smoke.sh

  disk-full:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs util-linux mount
      - run: sudo modprobe loop || true
      - run: sudo LUMONAS_DISK_FULL_ASSERT=true bash scripts/disk-full-smoke.sh

  race-fuzz:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./cmd/lumonasd ./cmd/lumonas-privd ./internal/backup ./internal/diagnostics ./internal/docker ./internal/network ./internal/recovery ./internal/storage
      - run: go test ./cmd/lumonasd ./cmd/lumonas-privd ./internal/backup ./internal/diagnostics ./internal/docker ./internal/network ./internal/recovery ./internal/storage -run 'Fuzz'

  security-controls:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: bash scripts/security-smoke.sh
      - run: bash scripts/command-boundary-smoke.sh

  dependency-controls:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install pinned govulncheck
        run: GOBIN="$RUNNER_TEMP/lumonas-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run dependency checks
        run: PATH="$RUNNER_TEMP/lumonas-tools:$PATH" LUMONAS_REQUIRE_DEPENDENCY_TOOLS=true bash scripts/dependency-smoke.sh
      - name: Pull pinned Trivy scanner
        run: docker pull aquasec/trivy:0.58.1
      - name: Scan repository and catalog images
        run: LUMONAS_CONTAINER_SCAN_REQUIRED=true bash scripts/container-image-scan.sh

  package:
    runs-on: ubuntu-latest
    needs: [backend, frontend, runtime-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: bash packaging/build-deb.sh "${GITHUB_SHA::12}"
      - run: bash scripts/verify-deb.sh "$(find . -maxdepth 1 -type f -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-deb
          path: '*.deb'

  qemu-smoke:
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y debootstrap qemu-utils grub-pc-bin qemu-system-x86 curl python3
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: .
      - run: sudo LUMONAS_DEB="$PWD/$(ls *.deb | head -n1)" LUMONAS_QEMU_IMAGE="$PWD/build/qemu/lumonas-debian13.raw" bash scripts/qemu-build-image.sh
      - run: LUMONAS_QEMU_IMAGE="$PWD/build/qemu/lumonas-debian13.raw" LUMONAS_QEMU_LOG="$PWD/build/qemu/qemu-smoke.log" LUMONAS_QEMU_ASSERT=true bash scripts/qemu-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-qemu
          path: |
            build/qemu/lumonas-debian13.raw
            build/qemu/qemu-smoke.log*
          if-no-files-found: error

  package-permissions:
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: build/package
      - run: bash scripts/permission-smoke.sh "$(find build/package -type f -name '*.deb' -print -quit)"

  iso:
    runs-on: ubuntu-latest
    needs: [qemu-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-qemu
          path: build/qemu
      - run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso dpkg-dev gnupg qemu-system-x86 qemu-utils curl python3
      - run: go build -trimpath -o "$RUNNER_TEMP/lumonas-recovery-fixture" ./cmd/lumonas-recovery-fixture
      - run: go build -trimpath -o "$RUNNER_TEMP/lumonas-recover" ./cmd/lumonas-recover
      - name: Import ISO repository signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          LUMONAS_REPO_PRIVATE_KEY: ${{ secrets.LUMONAS_REPO_PRIVATE_KEY }}
          LUMONAS_REPO_SIGN_KEY: ${{ secrets.LUMONAS_REPO_SIGN_KEY }}
        run: |
          test -n "$LUMONAS_REPO_PRIVATE_KEY"
          test -n "$LUMONAS_REPO_SIGN_KEY"
          export GNUPGHOME="$RUNNER_TEMP/lumonas-repo-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$LUMONAS_REPO_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$LUMONAS_REPO_SIGN_KEY" >/dev/null
          echo "LUMONAS_REPO_GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - run: sudo env LUMONAS_DEB="$PWD/$(ls *.deb | head -n1)" LUMONAS_ENABLE_RECOVERY_SMOKE=true LUMONAS_REPO_SIGN_KEY="${LUMONAS_REPO_SIGN_KEY}" LUMONAS_REQUIRE_REPO_SIGNATURE="${LUMONAS_REQUIRE_REPO_SIGNATURE}" LUMONAS_REPO_GNUPGHOME="${LUMONAS_REPO_GNUPGHOME}" bash installer/build-iso.sh "${GITHUB_SHA::12}"
        env:
          LUMONAS_REPO_SIGN_KEY: ${{ secrets.LUMONAS_REPO_SIGN_KEY }}
          LUMONAS_REQUIRE_REPO_SIGNATURE: ${{ startsWith(github.ref, 'refs/tags/') }}
      - run: LUMONAS_ISO="$PWD/build/releases/$(ls build/releases/*.iso | xargs -n1 basename)" LUMONAS_ISO_ASSERT=true LUMONAS_ISO_LOG="$PWD/build/iso-smoke.log" bash scripts/iso-smoke.sh
      - run: |
          source_image="$(find "$PWD/build/qemu" -type f -name '*.raw' -print -quit)"
          test -n "$source_image"
          sudo env LUMONAS_ISO="$PWD/build/releases/$(ls build/releases/*.iso | xargs -n1 basename)" LUMONAS_RECOVERY_ASSERT=true LUMONAS_RECOVERY_SOURCE_IMAGE="$source_image" LUMONAS_RECOVERY_FIXTURE="$RUNNER_TEMP/lumonas-recovery-fixture" LUMONAS_RECOVER_BIN="$RUNNER_TEMP/lumonas-recover" LUMONAS_RECOVERY_LOG="$PWD/build/qemu-recovery.log" bash scripts/qemu-recovery-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-iso
          path: build/releases/*
      - uses: actions/upload-artifact@v4
        with:
          name: lumonas-iso-smoke
          path: |
            build/iso-smoke.log
            build/qemu-recovery.log
          if-no-files-found: warn

  installer-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n installer/build-iso.sh packaging/build-deb.sh packaging/debian/postinst packaging/debian/prerm scripts/api-smoke.sh scripts/compose-smoke.sh scripts/container-image-scan.sh scripts/dependency-smoke.sh scripts/disk-full-smoke.sh scripts/frontend-runtime-smoke.sh scripts/iso-smoke.sh scripts/qemu-build-image.sh scripts/qemu-smoke.sh scripts/qemu-recovery-smoke.sh scripts/qemu-live-recovery-source.sh scripts/recovery-api-smoke.sh scripts/security-smoke.sh scripts/command-boundary-smoke.sh scripts/storage-loopback-smoke.sh scripts/privileged-storage-loopback-smoke.sh scripts/systemd-smoke.sh scripts/permission-smoke.sh scripts/log-retention-smoke.sh scripts/upgrade-smoke.sh scripts/upgrade-service-order-smoke.sh scripts/release-artifacts.sh scripts/release-artifacts-smoke.sh scripts/installer-signature-policy-smoke.sh scripts/verify-deb.sh scripts/verify-release.sh
      - run: sh -n installer/build-iso.sh packaging/build-deb.sh packaging/debian/postinst packaging/debian/prerm scripts/api-smoke.sh scripts/compose-smoke.sh scripts/container-image-scan.sh scripts/dependency-smoke.sh scripts/disk-full-smoke.sh scripts/frontend-runtime-smoke.sh scripts/iso-smoke.sh scripts/qemu-build-image.sh scripts/qemu-smoke.sh scripts/qemu-recovery-smoke.sh scripts/qemu-live-recovery-source.sh scripts/recovery-api-smoke.sh scripts/security-smoke.sh scripts/command-boundary-smoke.sh scripts/storage-loopback-smoke.sh scripts/privileged-storage-loopback-smoke.sh scripts/systemd-smoke.sh scripts/permission-smoke.sh scripts/log-retention-smoke.sh scripts/upgrade-smoke.sh scripts/upgrade-service-order-smoke.sh scripts/release-artifacts.sh scripts/release-artifacts-smoke.sh scripts/installer-signature-policy-smoke.sh scripts/verify-deb.sh scripts/verify-release.sh
      - run: bash scripts/upgrade-service-order-smoke.sh
      - run: bash scripts/release-artifacts-smoke.sh
      - run: bash scripts/installer-signature-policy-smoke.sh
      - run: bash scripts/release-gate-policy-smoke.sh
      - run: bash scripts/command-boundary-smoke.sh
      - run: python3 scripts/check-api-contract.py
      - run: bash scripts/log-retention-smoke.sh
      - run: LUMONAS_REQUIRE_SYSTEMD_VERIFY=true LUMONAS_REQUIRE_SYSTEMD_SECURITY=true sh scripts/verify-packaging.sh
      - run: LUMONAS_REQUIRE_SYSTEMD_SECURITY=true bash scripts/systemd-security-smoke.sh
      - run: sh -n scripts/verify-release.sh
      - run: git diff --check

  upgrade-compatibility:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./internal/store -run 'TestStoreReopenPreservesStateAcrossMigrations|TestOpenMigratesLegacyEventSchema|TestOpenMigratesLegacyRuntimeSchemaAsOneUpgrade'

  upgrade-debian:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: build/current
      - name: Download previous release package
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git tag --sort=-version:refname | awk -v current="${GITHUB_REF_NAME}" '$0 != current { print; exit }')"
          if [ -z "$previous" ]; then
            echo "No previous release tag is available; upgrade smoke is not applicable to the first release."
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_previous=true" >> "$GITHUB_OUTPUT"
          mkdir -p build/previous
          gh release download "$previous" --pattern '*.deb' --dir build/previous
      - if: steps.previous.outputs.has_previous == 'true'
        run: bash scripts/upgrade-smoke.sh "$(find build/previous -type f -name '*.deb' -print -quit)" "$(find build/current -type f -name '*.deb' -print -quit)"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package, package-permissions, qemu-smoke, iso, installer-scripts, safety-recovery, recovery-api, storage-loopback, privileged-storage-loopback, disk-full, share-integrations, compose-validation, security-controls, dependency-controls, race-fuzz, upgrade-compatibility, upgrade-debian]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-deb
          path: build/releases
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-iso
          path: build/releases
      - uses: actions/download-artifact@v4
        with:
          name: lumonas-qemu
          path: build/releases
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
      - run: LUMONAS_REQUIRE_SBOM=true LUMONAS_SIGN_ARTIFACTS=true bash scripts/release-artifacts.sh build/releases
      - name: Compute release source timestamp
        run: echo "LUMONAS_EXPECTED_SOURCE_DATE_EPOCH=$(git show -s --format=%ct \"$GITHUB_SHA\")" >> "$GITHUB_ENV"
      - name: Verify release signatures and provenance
        env:
          LUMONAS_REQUIRE_SBOM: true
          LUMONAS_REQUIRE_SIGNATURES: true
          LUMONAS_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          LUMONAS_COSIGN_CERTIFICATE_IDENTITY_REGEXP: "${{ github.server_url }}/${{ github.repository }}/.github/workflows/.+@refs/tags/${{ github.ref_name }}"
          LUMONAS_COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: LUMONAS_REQUIRE_RELEASE_SET=true bash scripts/verify-release.sh build/releases
      - uses: softprops/action-gh-release@v2
        with:
          files: build/releases/*
